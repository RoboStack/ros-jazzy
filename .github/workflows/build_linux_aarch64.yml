      ros2-ros-workspace ros2-ros-environment ament-cmake-core
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
    needs: []
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0.10.2
      with:
        pixi-version: v0.78.0
        cache: 'true'
        log-level: v
        frozen: 'true'
    - name: Build ros2-distro-mutex ros2-ament-package ros2-ament-cmake-core ros-jazzy-ament-package
        ros2-ros-workspace ros2-ros-environment ros-jazzy-ament-cmake-core
      env:
        ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        CURRENT_RECIPES: ros2-distro-mutex ros2-ament-package ros2-ament-cmake-core
          ros-jazzy-ament-package ros2-ros-workspace ros2-ros-environment ros-jazzy-ament-cmake-core
        BUILD_TARGET: linux-aarch64
      run: |
        export CI=github
        export GIT_BRANCH=${GITHUB_REF_NAME}
        export FEEDSTOCK_NAME=${GITHUB_REPOSITORY##*/}
        .scripts/build_unix.sh --target $BUILD_TARGET
    permissions:
      id-token: write
      attestations: write
