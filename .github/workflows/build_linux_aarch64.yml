jobs:
  stage_0_job_0:
    name: ros2-rqt-joint-trajectory-controller ros2-rqt-controller-manager ros2-nonpersistent-voxel-layer
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
    needs: []
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0.10.2
      with:
        pixi-version: v0.78.0
        cache: 'true'
        log-level: v
        frozen: 'true'
    - name: Build ros2-rqt-joint-trajectory-controller ros2-rqt-controller-manager
        ros2-nonpersistent-voxel-layer
      env:
        ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        CURRENT_RECIPES: ros2-rqt-joint-trajectory-controller ros2-rqt-controller-manager
          ros2-nonpersistent-voxel-layer
        BUILD_TARGET: linux-aarch64
      run: |
        export CI=azure
        export GIT_BRANCH=$BUILD_SOURCEBRANCHNAME
        export FEEDSTOCK_NAME=$(basename ${BUILD_REPOSITORY_NAME})
        .scripts/build_unix.sh --target $BUILD_TARGET
    permissions:
      id-token: write
      attestations: write
  stage_1_job_1:
    name: rqt-joint-trajectory-controller rqt-controller-manager nonpersistent-voxel-layer
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
    needs:
    - stage_0_job_0
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0.10.2
      with:
        pixi-version: v0.78.0
        cache: 'true'
        log-level: v
        frozen: 'true'
    - name: Build ros-jazzy-rqt-joint-trajectory-controller ros-jazzy-rqt-controller-manager
        ros-jazzy-nonpersistent-voxel-layer
      env:
        ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        CURRENT_RECIPES: ros-jazzy-rqt-joint-trajectory-controller ros-jazzy-rqt-controller-manager
          ros-jazzy-nonpersistent-voxel-layer
        BUILD_TARGET: linux-aarch64
      run: |
        export CI=azure
        export GIT_BRANCH=$BUILD_SOURCEBRANCHNAME
        export FEEDSTOCK_NAME=$(basename ${BUILD_REPOSITORY_NAME})
        .scripts/build_unix.sh --target $BUILD_TARGET
    permissions:
      id-token: write
      attestations: write
name: build_linux_aarch64
on:
  push:
    branches:
    - buildbranch_linux_aarch64
