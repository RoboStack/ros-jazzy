name: Reproduce osx-arm64 qt_gui_cpp failure

on:
  pull_request:

concurrency:
  group: repro-osx-qt-gui-cpp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    name: Reproduce qt_gui_cpp SIP deployment target issue
    runs-on: macos-15
    timeout-minutes: 90
    env:
      TARGET_PLATFORM: ${{ inputs.target_platform || 'osx-arm64' }}
      ARTIFACT_DIR: repro-artifacts
      CONDA_BLD_PATH: ${{ github.workspace }}/conda-bld
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          frozen: true
          cache: true
          log-level: v

      - name: Disable git auto-maintenance in source caches
        shell: bash -l {0}
        run: git config --global maintenance.auto false

      - name: Run focused reproduction
        shell: bash -l {0}
        env:
          RECIPE_BATCH: ${{ inputs.recipe_batch || '' }}
        run: |
          chmod +x .scripts/repro_osx_qt_gui_cpp.bash
          if [[ -n "$RECIPE_BATCH" ]]; then
            # shellcheck disable=SC2086
            .scripts/repro_osx_qt_gui_cpp.bash $RECIPE_BATCH
          else
            .scripts/repro_osx_qt_gui_cpp.bash
          fi

      - name: Upload reproduction diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qt-gui-cpp-repro-${{ env.TARGET_PLATFORM }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: repro-artifacts
          if-no-files-found: warn
          retention-days: 14
