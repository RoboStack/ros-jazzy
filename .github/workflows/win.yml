        :: Enable long path names on Windows
        reg add HKLM\SYSTEM\CurrentControlSet\Control\FileSystem /v LongPathsEnabled /t REG_DWORD /d 1 /f

        for %%X in (%CURRENT_RECIPES%) do (
            echo "BUILDING RECIPE %%X"
            cd %FEEDSTOCK_ROOT%\recipes\%%X\
            pixi run -v rattler-build build --recipe %FEEDSTOCK_ROOT%\recipes\%%X\ ^
                -m %FEEDSTOCK_ROOT%\conda_build_config.yaml ^
                -c robostack-jazzy -c conda-forge ^
                --output-dir %CONDA_BLD_PATH%

            if errorlevel 1 exit 1
            rem -m %FEEDSTOCK_ROOT%\.ci_support\conda_forge_pinnings.yaml
        )

        :: Check if .conda files exist in the win-64 directory
        if exist "%CONDA_BLD_PATH%\win-64\*.conda" (
            echo Found .conda files, starting upload...
            for %%F in ("%CONDA_BLD_PATH%\win-64\*.conda") do (
                echo Uploading %%F
                pixi run upload "%%F" --force
                if errorlevel 1 exit 1
            )
        ) else (
            echo Warning: No .conda files found in %CONDA_BLD_PATH%\win-64
            echo This might be due to all the packages being skipped
        )
      env:
        ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        CURRENT_RECIPES: ros2-moveit-setup-srdf-plugins ros2-moveit-planners ros2-moveit-setup-core-plugins
          ros2-moveit-setup-controllers ros2-moveit-setup-app-plugins ros2-moveit-ros-trajectory-cache
          ros-jazzy-pilz-industrial-motion-planner ros-jazzy-moveit-setup-framework
          ros-jazzy-moveit-servo ros-jazzy-moveit-ros ros2-clearpath-manipulators
          ros2-moveit-setup-assistant ros2-ur-moveit-config ros-jazzy-moveit-setup-srdf-plugins
          ros-jazzy-moveit-setup-core-plugins ros-jazzy-moveit-setup-controllers ros-jazzy-moveit-setup-app-plugins
          ros-jazzy-moveit-ros-trajectory-cache ros-jazzy-moveit-planners
        PYTHONUNBUFFERED: 1
      name: Build ros2-moveit-setup-srdf-plugins ros2-moveit-planners ros2-moveit-setup-core-plugins
        ros2-moveit-setup-controllers ros2-moveit-setup-app-plugins ros2-moveit-ros-trajectory-cache
        ros-jazzy-pilz-industrial-motion-planner ros-jazzy-moveit-setup-framework
        ros-jazzy-moveit-servo ros-jazzy-moveit-ros ros2-clearpath-manipulators ros2-moveit-setup-assistant
        ros2-ur-moveit-config ros-jazzy-moveit-setup-srdf-plugins ros-jazzy-moveit-setup-core-plugins
        ros-jazzy-moveit-setup-controllers ros-jazzy-moveit-setup-app-plugins ros-jazzy-moveit-ros-trajectory-cache
