            echo This might be due to all the packages being skipped
        )
      env:
        ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        CURRENT_RECIPES: ros2-roboplan-toppra ros2-roboplan-oink ros2-roboplan-simple-ik
          ros2-roboplan-ros-cpp ros2-roboplan-ros-examples ros2-roboplan-rrt ros-jazzy-roboplan
          ros2-roboplan-cartesian-planning ros2-roboplan-ros-visualization ros2-roboplan-ros-py
          ros-jazzy-roboplan-toppra ros-jazzy-roboplan-simple-ik ros-jazzy-roboplan-rrt
          ros-jazzy-roboplan-ros-examples ros-jazzy-roboplan-ros-cpp ros-jazzy-roboplan-oink
        PYTHONUNBUFFERED: 1
      name: Build ros2-roboplan-toppra ros2-roboplan-oink ros2-roboplan-simple-ik
        ros2-roboplan-ros-cpp ros2-roboplan-ros-examples ros2-roboplan-rrt ros-jazzy-roboplan
        ros2-roboplan-cartesian-planning ros2-roboplan-ros-visualization ros2-roboplan-ros-py
        ros-jazzy-roboplan-toppra ros-jazzy-roboplan-simple-ik ros-jazzy-roboplan-rrt
        ros-jazzy-roboplan-ros-examples ros-jazzy-roboplan-ros-cpp ros-jazzy-roboplan-oink
    permissions:
      id-token: write
      attestations: write
  stage_2_job_2:
    name: ros2-roboplan-examples roboplan-ros-visualization roboplan-ros-py roboplan-cartesian-planning
      roboplan-examples
