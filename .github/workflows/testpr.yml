on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  ROS_VERSION: 2
  # Change to 'true' to enable the cache upload as artifacts
  SAVE_CACHE_AS_ARTIFACT: 'false'
  # Change to 'true' to ignore cache and force a full rebuild, but please restore to 'false' before merging
  IGNORE_CACHE_AND_DO_FULL_REBUILD: 'false'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-64
            folder_cache: 'output/linux-64'
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            folder_cache: 'output/linux-aarch64'
          - os: macos-15-intel
            platform: osx-64
            folder_cache: 'output/osx-64'
          - os: macos-15
            platform: osx-arm64
            folder_cache: 'output/osx-arm64'
          - os: windows-2022
            platform: win-64
            folder_cache: 'C:/bld/win-64'

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal token
        fetch-depth: 0 # otherwise, you will failed to push refs to dest repo

    - uses: prefix-dev/setup-pixi@v0.10.2
      with:
        frozen: true
        pixi-version: v0.75.0

    - name: Check sorting
      if: matrix.platform == 'linux-64'
      shell: bash -l {0}
      run: |
        pixi run sort --check

    - name: Check sorting
      if: matrix.platform == 'linux-64'
      shell: bash -l {0}
      run: |
        pixi run sort --check

    - name: Long paths workarounds for win-64
      shell: bash -l {0}
      if: matrix.platform == 'win-64'
      run: |
        # Workaround for problem related to long paths
        echo "CONDA_BLD_PATH=C:\\bld\\" >> $GITHUB_ENV
        mkdir /c/bld

    # Workaround for https://github.com/RoboStack/ros-humble/pull/141#issuecomment-1941919816
    - name: Clean up PATH
      if: contains(matrix.os, 'windows')
      uses: egor-tensin/cleanup-path@v5
      with:
        # cygpath in C:\Program Files\Git\usr\bin is used by install micromamba
        # git in C:\Program Files\Git\bin is used by pip install git+
        dirs: 'C:\Program Files\Git\usr\bin;C:\Program Files\Git\bin;C:\Program Files\Git\cmd;C:\Program Files\Git\mingw64\bin'

    # For some reason, the Strawberry perl's pkg-config is found
    # instead of the conda's one, so let's delete the /c/Strawberry directory
    # Furthermore, we also need to remove an older SDK that is used and can result in compilation problems
    # And we also remove the vcpkg installed in the image, to avoid that projects pick it
    - name: Remove problematic files of GitHub Actions images
      if: contains(matrix.os, 'windows')
      shell: bash -l {0}
      run: |
        rm -rf /c/Strawberry
        rm -rf "/c/Program Files (x86)/Windows Kits/10/Include/10.0.17763.0/"

    - name: Disable git auto-maintenance in source caches
      shell: bash -l {0}
      run: |
        git config --global maintenance.auto false

    - name: Generate recipes
      shell: bash -l {0}
      run: |
        set -e
        for attempt in 1 2 3; do
          rm -rf recipes
          mkdir -p recipes
          if pixi run -v vinca --platform ${{ matrix.platform }} -m -n; then
            break
          fi
          if [[ "${attempt}" == "3" ]]; then
            echo "Recipe generation failed after ${attempt} attempts" >&2
            exit 1
          fi
          echo "Recipe generation attempt ${attempt} failed; retrying..." >&2
          sleep 15
        done

    - name: Check patches
      shell: bash -l {0}
      run: |
        pixi run check-patches

    - name: Restore build cache
      id: cache-restore
      uses: actions/cache/restore@v5
      with:
        path: |
          ${{ matrix.folder_cache }}
        key: ${{ runner.os }}-${{ matrix.platform }}-pr-${{ github.event.pull_request.number }}
        # allow a later run to pick up a cache that has an extra suffix
        restore-keys: |
          ${{ runner.os }}-${{ matrix.platform }}-pr-${{ github.event.pull_request.number }}-

    - name: Optional force full rebuild
      if: ${{ env.IGNORE_CACHE_AND_DO_FULL_REBUILD == 'true' }}
      shell: bash -l {0}
      run: |
        rm -rf ${{ matrix.folder_cache }}/*

    - name: Delete specific outdated cache entries
      shell: bash -l {0}
      run: |
        # rm -rf ${{ matrix.folder_cache }}/ros-jazzy-mrt-cmake-modules* || true
        mkdir -p ${{ matrix.folder_cache }}
        rm -rf ${{ matrix.folder_cache }}/ros2-python-qt-binding* || true
        rm -rf ${{ matrix.folder_cache }}/ros2-qt-gui-cpp* || true
        # ros2-ros-workspace itself never failed to build, so its cached
        # artifact (already at build_number 22, matching current) keeps
        # getting reused by --skip-existing despite predating 904749dd's
        # ros2-distro-mutex 0.16.0 -> 0.17.0 bump; the cached build's baked-in
        # run_constraint on the old mutex is now unsatisfiable. Same pattern
        # likely affects other "ros2-*" legacy-compat package aliases built
        # around the same time -- add more here as they surface.
        rm -rf ${{ matrix.folder_cache }}/ros2-ros-workspace* || true
        rm -rf ${{ matrix.folder_cache }}/ros2-ament-package* || true
        rm -rf ${{ matrix.folder_cache }}/ros2-ament-cmake-core* || true
        # ros2-control-msgs's win-64 build failed to find sensor_msgs's cmake
        # config even though ros2-sensor-msgs was present in the local channel
        # -- its cached .conda was only ~25KB (a normal message package is far
        # larger), suggesting a prior interrupted/cancelled build (this PR has
        # had many superseding pushes via the concurrency group) got cached in
        # a corrupt, incomplete state. Force it to rebuild fresh.
        rm -rf ${{ matrix.folder_cache }}/ros2-sensor-msgs* || true
        # Same corrupt-cache pattern hit a second foundational message package:
        # ros2-rcl (win-64) failed to find rcl_interfaces's cmake config, and
        # its cached .conda was also only ~25KB. Add more here as they surface.
        rm -rf ${{ matrix.folder_cache }}/ros2-rcl-interfaces* || true
        # Third instance of the same ~25KB corrupt-cache pattern on win-64:
        # ros2-hardware-interface failed to find control_msgs's cmake config.
        # If this keeps recurring across more packages, consider a one-time
        # full win-64 cache wipe (IGNORE_CACHE_AND_DO_FULL_REBUILD) instead of
        # continuing to whack-a-mole individual packages here.
        rm -rf ${{ matrix.folder_cache }}/ros2-control-msgs* || true
        # Fifth instance of the same ~25KB corrupt-cache pattern on win-64
        # (after sensor_msgs, rcl_interfaces, control_msgs, tf2_ros): this one
        # recurred even after a full win-64 cache wipe, so a corruption is
        # apparently still happening in some later save, not just a one-time
        # legacy artifact. rclcpp_components failed to find
        # composition_interfaces's cmake config.
        rm -rf ${{ matrix.folder_cache }}/ros2-composition-interfaces* || true
        # ros2-libg2o's cached artifact still has its old qt (Qt5) run
        # dependency baked in from before the qt host dep was dropped,
        # conflicting with pcl's qt6-main requirement and failing the solve
        # entirely. Force it to rebuild fresh without that dependency.
        rm -rf ${{ matrix.folder_cache }}/ros2-libg2o* || true
        # Not actually a stale-cache issue (confirmed: still failed on a
        # fresh rebuild) -- cartographer's own host env left lua unpinned,
        # conflicting with conda-forge's separately-published "cartographer"
        # package pulled in by its dummy-package run constraint. Real fix is
        # the lua host pin in patch/dependencies.yaml; forcing a rebuild here
        # just makes sure this picks up that fix promptly.
        rm -rf ${{ matrix.folder_cache }}/ros2-cartographer* || true
        # ros2-coal's generated dummy-package run-constraint was stale at
        # "coal >=3.0.3,<3.0.4a0" (pkg_additional_info.yaml override_version),
        # capping it below the libcoal >=3.0.4 that pinocchio 4.1.0 and
        # eigenpy 3.13.0 need from conda-forge -- this made
        # ros2-pinocchio's test-environment solve unsatisfiable (confirmed
        # via full recipe resolution in a local multipass VM). Force both to
        # rebuild fresh with the corrected 3.0.4 pin.
        rm -rf ${{ matrix.folder_cache }}/ros2-coal* || true
        rm -rf ${{ matrix.folder_cache }}/ros2-pinocchio* || true
        pixi run rattler-index fs ${{ matrix.folder_cache }}/.. --force
        exit 0

    - name: See packages restored by cache
      shell: bash -l {0}
      run: |
        ls ${{ matrix.folder_cache }} || true

    - name: Build recipes
      id: build-recipes
      shell: bash -l {0}
      run: |
        set +e
        # Without this, resolvo's strict channel priority can refuse a
        # just-built local package outright once any other-channel build of
        # the same name exists, even when the local one is the only valid
        # option (confirmed via a peer session hitting and fixing the
        # identical issue on rolling) -- e.g. ros2-pinocchio's own test step
        # excluding its freshly-built local .conda and falling back through
        # an unrelated, unsatisfiable dependency chain instead.
        pixi run rattler-build build --recipe-dir recipes --target-platform ${{ matrix.platform }} -m ./conda_build_config.yaml -c conda-forge -c robostack-jazzy --skip-existing --channel-priority disabled 2>&1 | tee rattler-build.log
        build_status=${PIPESTATUS[0]}
        echo "exit-code=${build_status}" >> "$GITHUB_OUTPUT"
        exit "$build_status"

    - name: Summarize build result
      if: always()
      shell: bash -l {0}
      run: |
        pixi run python .github/scripts/summarize_rattler_build.py \
          --log rattler-build.log \
          --platform "${{ matrix.platform }}" \
          --outcome "${{ steps.build-recipes.outcome }}" \
          >> "$GITHUB_STEP_SUMMARY"

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: build-log-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: rattler-build.log
        if-no-files-found: warn
        retention-days: 7

    - name: See packages that will be saved in cache
      shell: bash -l {0}
      if: always()
      run: |
        ls ${{ matrix.folder_cache }} || true

    - name: Save build cache
      uses: actions/cache/save@v5
      # Save partial output when the build fails or is cancelled by the job timeout; do not save when it was skipped.
      if: ${{ always() && (steps.build-recipes.outcome == 'success' || steps.build-recipes.outcome == 'failure' || steps.build-recipes.outcome == 'cancelled') }}
      with:
        path: |
          ${{ matrix.folder_cache }}
        key: ${{ runner.os }}-${{ matrix.platform }}-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Generate GitHub Actions workflows to catch post-PR problems
      shell: bash -l {0}
      run: |
        pixi run vinca-gha --platform ${{ matrix.platform }} --trigger-branch dummy_build_branch_as_it_is_unused -d ./recipes

    - name: Upload build cache as artifact
      # Keep artifacts consistent with the cache: retain partial output from failed or cancelled builds, but not skipped builds.
      if: ${{ always() && env.SAVE_CACHE_AS_ARTIFACT == 'true' && (steps.build-recipes.outcome == 'success' || steps.build-recipes.outcome == 'failure' || steps.build-recipes.outcome == 'cancelled') }}
      uses: actions/upload-artifact@v6
      with:
        name: cache-${{ matrix.platform }}-${{ github.run_id }}
        path: ${{ matrix.folder_cache }}
        retention-days: 7
