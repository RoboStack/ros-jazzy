  - '2023'
urdfdom:
  - '6.0'
urdfdom_headers:
  - '3.0'
vtk:
  - 9.6.2


cdt_name:  # [linux]
  - conda  # [linux]

python:
  - 3.12.* *_cpython
python_impl:
  - cpython

c_compiler:
  - gcc                        # [linux]
  - clang                      # [osx]
  - vs2022                     # [win]
