  # jsoncpp 1.9.8 migration is nearly complete on conda-forge.
  - 1.9.8
libopencv:
  - 4.13.0
libmujoco:
  - 3.10.0
# Mitigation for
# https://github.com/RoboStack/ros-jazzy/pull/126#issuecomment-3515455380
libcap:
  - 2.78
libhwloc:
  - 2.13.0
libxml2:
  - '2.14'
libzenohc:
  - 1.9.0
libzenohcxx:
  - 1.9.0
lua:
  - 5.4
pugixml:
  - '1.15'
shaderc:
  - '2026.3'
