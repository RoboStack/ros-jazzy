ros_distro: jazzy

package_name_mode: both

pixi_version: 0.78.0
setup_pixi_version: 0.10.2

# mapping for package keys
conda_index:
  - robostack.yaml
  - packages-ignore.yaml

# Reminder for next full rebuild, the next build number should be 23
build_number: 22

mutex_package:
  name: "ros2-distro-mutex"
  version: "0.17.0"
  # Bumped independently of build_number so the mutex is re-published with the new
  # run_constraints (vtk 9.7.0) while already-built packages (ros2-distro-mutex
  # 0.16.* jazzy_*) stay valid instead of silently resolving against a stale pin.
  upper_bound: "x.x"
  run_constraints:
    - libboost 1.90.*
    - libboost-devel 1.90.*
    - pcl 1.15.1.*
    - gazebo 11.*
    - libprotobuf 7.35.*
    - vtk 9.7.0.*

packages_skip_by_deps:

  - if: not linux
    then:
      - pendulum_control
      - rttest
      - tlsf
      - tlsf_cpp

packages_remove_from_deps:

  - if: not linux
    then:
      - pendulum_control
      - rttest
      - tlsf
      - tlsf_cpp

skip_existing:
  # - output
  - https://conda.anaconda.org/robostack-jazzy/

