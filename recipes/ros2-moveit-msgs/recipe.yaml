# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-moveit-msgs
  version: 2.6.0
source:
  git: https://github.com/ros2-gbp/moveit_msgs-release.git
  tag: release/jazzy/moveit_msgs/2.6.0-1
  target_directory: ros2-moveit-msgs/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://moveit.ros.org
  repository: https://github.com/ros-planning/moveit_msgs
  license: BSD-3-Clause
  summary: Messages, services and actions used by MoveIt
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
    - if: target_platform == 'emscripten-wasm32'
      then:
        - ros2-rosidl-default-generators
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros2-action-msgs
    - ros2-ament-cmake
    - ros2-ament-lint-auto
    - ros2-ament-lint-cmake
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-object-recognition-msgs
    - ros2-octomap-msgs
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-rosidl-default-generators
    - ros2-sensor-msgs
    - ros2-shape-msgs
    - ros2-std-msgs
    - ros2-trajectory-msgs
  run:
    - python
    - ros2-action-msgs
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-object-recognition-msgs
    - ros2-octomap-msgs
    - ros2-ros-workspace
    - ros2-rosidl-default-runtime
    - ros2-sensor-msgs
    - ros2-shape-msgs
    - ros2-std-msgs
    - ros2-trajectory-msgs
