# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-roboplan-ros-py
  version: 0.6.1
source:
  git: https://github.com/ros2-gbp/roboplan_ros-release.git
  tag: release/jazzy/roboplan_ros_py/0.6.1-1
  target_directory: ros2-roboplan-ros-py/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_python.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_python.bat' }}
  number: 21
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://roboplan-ros.readthedocs.io
  repository: https://github.com/open-planning/roboplan-ros
  license: MIT
  summary: ROS 2 Python bindings for the roboplan motion planning library.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - pytest
    - python
    - ros2-builtin-interfaces
    - ros2-distro-mutex 0.16.* jazzy_*
    - ros2-rclpy
    - ros2-roboplan
    - ros2-roboplan-ros-cpp
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-sensor-msgs
    - ros2-trajectory-msgs
    - setuptools
  run:
    - python
    - ros2-builtin-interfaces
    - ros2-distro-mutex 0.16.* jazzy_*
    - ros2-rclpy
    - ros2-roboplan
    - ros2-roboplan-ros-cpp
    - ros2-ros-workspace
    - ros2-sensor-msgs
    - ros2-trajectory-msgs
