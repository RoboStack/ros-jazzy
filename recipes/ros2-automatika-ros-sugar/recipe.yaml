# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-automatika-ros-sugar
  version: 0.7.1
source:
  git: https://github.com/ros2-gbp/automatika_ros_sugar-release.git
  tag: release/jazzy/automatika_ros_sugar/0.7.1-1
  target_directory: ros2-automatika-ros-sugar/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://github.com/automatika-robotics/sugarcoat
  repository: https://github.com/automatika-robotics/ros-sugar
  license: MIT
  summary: Syntactic sugar for ROS2 nodes creation and management
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
    - if: target_platform == 'emscripten-wasm32'
      then:
        - ros2-rosidl-default-generators
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - jinja2
    - libopencv
    - msgpack-python
    - numpy
    - pip
    - py-opencv
    - pytest
    - python
    - pyyaml
    - ros2-ament-cmake
    - ros2-ament-cmake-pytest
    - ros2-ament-cmake-python
    - ros2-ament-index-python
    - ros2-ament-lint-auto
    - ros2-builtin-interfaces
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-launch
    - ros2-launch-testing
    - ros2-lifecycle-msgs
    - ros2-nav-msgs
    - ros2-rclcpp
    - ros2-rclpy
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-rosidl-default-generators
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-tf2-ros
  run:
    - jinja2
    - libopencv
    - msgpack-python
    - numpy
    - py-opencv
    - python
    - pyyaml
    - ros2-builtin-interfaces
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-lifecycle-msgs
    - ros2-nav-msgs
    - ros2-rclcpp
    - ros2-rclpy
    - ros2-ros-workspace
    - ros2-rosidl-default-runtime
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-tf2-ros
