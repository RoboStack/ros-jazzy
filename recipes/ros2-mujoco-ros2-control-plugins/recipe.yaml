# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-mujoco-ros2-control-plugins
  version: 0.1.2
source:
  git: https://github.com/ros2-gbp/mujoco_ros2_control-release.git
  tag: release/jazzy/mujoco_ros2_control_plugins/0.1.2-1
  target_directory: ros2-mujoco-ros2-control-plugins/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/ros-controls/mujoco_ros2_control
  license: Apache-2.0
  summary: Plugin package for mujoco_ros2_control
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - glfw 3.*
    - libegl-devel
    - libgl-devel
    - libopengl-devel
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-gtest
    - ros2-ament-index-cpp
    - ros2-backward-ros
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-mujoco-3d-lidar
    - ros2-mujoco-ros2-control-msgs
    - ros2-mujoco-vendor
    - ros2-pluginlib
    - ros2-rclcpp
    - ros2-realtime-tools
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-ros2-control-cmake
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-std-srvs
    - ros2-visualization-msgs
  run:
    - glfw
    - libgl-devel
    - libopengl-devel
    - python
    - ros2-backward-ros
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-mujoco-ros2-control-msgs
    - ros2-mujoco-vendor
    - ros2-pluginlib
    - ros2-rclcpp
    - ros2-realtime-tools
    - ros2-ros-workspace
    - ros2-ros2-control-cmake
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-std-srvs
    - ros2-visualization-msgs
