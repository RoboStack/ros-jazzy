# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-ur-moveit-config
  version: 3.9.0
source:
  git: https://github.com/ros2-gbp/Universal_Robots_ROS2_Driver-release.git
  tag: release/jazzy/ur_moveit_config/3.9.0-1
  target_directory: ros2-ur-moveit-config/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://docs.universal-robots.com/Universal_Robots_ROS_Documentation/
  repository: https://github.com/UniversalRobots/Universal_Robots_ROS2_Driver
  license: Apache-2.0
  summary: An example package with MoveIt2 configurations for UR robots.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-rclpy
    - ros2-ros-environment
    - ros2-ros-workspace
  run:
    - python
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-moveit-configs-utils
    - ros2-moveit-kinematics
    - ros2-moveit-planners
    - ros2-moveit-planners-chomp
    - ros2-moveit-ros-move-group
    - ros2-moveit-ros-visualization
    - ros2-moveit-servo
    - ros2-moveit-simple-controller-manager
    - ros2-rclpy
    - ros2-ros-workspace
    - ros2-ur-description
    - ros2-warehouse-ros-sqlite
    - ros2-xacro
