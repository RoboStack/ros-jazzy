# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-iceoryx-binding-c
  version: 2.95.8

build:
  number: 25
  script: ''
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://iceoryx.io
  repository: https://github.com/eclipse-iceoryx/iceoryx
  license: Apache-2.0
  summary: Eclipse iceoryx inter-process-communication (IPC) middleware C-Language Binding
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build: []
  host:
    - python
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-iceoryx-hoofs
    - ros2-iceoryx-posh
    - ros2-ros-environment
    - ros2-ros-workspace
  run:
    - libiceoryx-binding-c >=2.95.8, <2.96.0a0
    - python
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-ros-workspace
