# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-ur-description
  version: 3.5.1
source:
  git: https://github.com/ros2-gbp/ur_description-release.git
  tag: release/jazzy/ur_description/3.5.1-1
  target_directory: ros2-ur-description/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/UniversalRobots/Universal_Robots_ROS2_Description
  license: BSD-3-Clause OR LicenseRef-Universal-Robots-A-S--Terms-and-Conditions-for-Use-of-Graphical-Documentation
  summary: URDF description for Universal Robots
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-pytest
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-launch-testing-ament-cmake
    - ros2-launch-testing-ros
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-xacro
    - urdfdom
  run:
    - python
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-joint-state-publisher-gui
    - ros2-launch
    - ros2-launch-ros
    - ros2-robot-state-publisher
    - ros2-ros-workspace
    - ros2-rviz2
    - ros2-urdf
    - ros2-xacro
