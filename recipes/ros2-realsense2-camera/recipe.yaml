# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-realsense2-camera
  version: 4.58.4
source:
  git: https://github.com/ros2-gbp/realsense-ros-release.git
  tag: release/jazzy/realsense2_camera/4.58.4-1
  target_directory: ros2-realsense2-camera/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://www.ros.org/wiki/RealSense
  repository: https://github.com/IntelRealSense/realsense-ros
  license: Apache-2.0
  summary: RealSense camera package allowing access to RealSense D400 3D cameras
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - eigen
    - eigen-abi-devel
    - numpy
    - pip
    - python
    - requests
    - ros2-ament-cmake
    - ros2-ament-cmake-gtest
    - ros2-ament-cmake-pytest
    - ros2-builtin-interfaces
    - ros2-cv-bridge
    - ros2-diagnostic-updater
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-image-transport
    - ros2-launch-pytest
    - ros2-launch-testing
    - ros2-librealsense2
    - ros2-lifecycle-msgs
    - ros2-nav-msgs
    - ros2-rclcpp
    - ros2-rclcpp-action
    - ros2-rclcpp-components
    - ros2-rclcpp-lifecycle
    - ros2-realsense2-camera-msgs
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-ros2bag
    - ros2-ros2topic
    - ros2-rosbag2-storage-default-plugins
    - ros2-sensor-msgs
    - ros2-sensor-msgs-py
    - ros2-std-msgs
    - ros2-std-srvs
    - ros2-tf2
    - ros2-tf2-ros
    - ros2-tf2-ros-py
  run:
    - eigen
    - eigen-abi-devel
    - python
    - ros2-builtin-interfaces
    - ros2-cv-bridge
    - ros2-diagnostic-updater
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-image-transport
    - ros2-launch-ros
    - ros2-librealsense2
    - ros2-lifecycle-msgs
    - ros2-nav-msgs
    - ros2-rclcpp
    - ros2-rclcpp-action
    - ros2-rclcpp-components
    - ros2-rclcpp-lifecycle
    - ros2-realsense2-camera-msgs
    - ros2-ros-workspace
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-std-srvs
    - ros2-tf2
    - ros2-tf2-ros
