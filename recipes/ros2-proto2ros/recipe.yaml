# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-proto2ros
  version: 1.0.1
source:
  git: https://github.com/rai-opensource/proto2ros-release.git
  tag: release/jazzy/proto2ros/1.0.1-2
  target_directory: ros2-proto2ros/src/work
  patches:
    - patch/ros-jazzy-proto2ros.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/rai-opensource/proto2ros
  license: MIT
  summary: Protobuf to ROS 2 interoperability interfaces
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
    - if: target_platform == 'emscripten-wasm32'
      then:
        - ros2-rosidl-default-generators
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - clang-tools
    - libprotobuf
    - numpy
    - pip
    - protobuf
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-mypy
    - ros2-ament-cmake-pytest
    - ros2-ament-cmake-python
    - ros2-builtin-interfaces
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-rclcpp
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-rosidl-default-generators
    - ros2-std-msgs
  run:
    - jinja2
    - libprotobuf
    - numpy
    - protobuf
    - python
    - pyyaml
    - ros2-ament-cmake-mypy
    - ros2-builtin-interfaces
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-rclcpp
    - ros2-rclpy
    - ros2-ros-workspace
    - ros2-rosidl-adapter
    - ros2-rosidl-default-generators
    - ros2-rosidl-default-runtime
    - ros2-std-msgs
