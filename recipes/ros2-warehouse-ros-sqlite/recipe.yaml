# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-warehouse-ros-sqlite
  version: 1.0.9
source:
  git: https://github.com/ros2-gbp/warehouse_ros_sqlite-release.git
  tag: release/jazzy/warehouse_ros_sqlite/1.0.9-1
  target_directory: ros2-warehouse-ros-sqlite/src/work
  patches:
    - patch/ros-jazzy-warehouse-ros-sqlite.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://ros.org/wiki/warehouse_ros
  repository: https://github.com/ros-planning/warehouse_ros_sqlite
  license: BSD-3-Clause
  summary: Implementation of warehouse_ros for sqlite
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - libboost-devel
    - libboost-python-devel
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-copyright
    - ros2-ament-cmake-gtest
    - ros2-ament-lint-auto
    - ros2-ament-lint-common
    - ros2-class-loader
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-rclcpp
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-sqlite3-vendor
    - ros2-warehouse-ros
    - sqlite 3.*
  run:
    - python
    - ros2-class-loader
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-rclcpp
    - ros2-ros-workspace
    - ros2-sqlite3-vendor
    - ros2-warehouse-ros
    - sqlite
