# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-toppra
  version: 0.6.9

build:
  number: 21
  script: ''
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://hungpham2511.github.io/toppra/index.html
  license: MIT
  summary: Time-Optimal Path Parameterization
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - pybind11
  host:
    - eigen
    - eigen-abi-devel
    - pybind11
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-gtest
    - ros2-ament-cmake-python
    - ros2-distro-mutex 0.16.* jazzy_*
    - ros2-ros-environment
    - ros2-ros-workspace
  run:
    - eigen
    - eigen-abi-devel
    - python
    - ros2-distro-mutex 0.16.* jazzy_*
    - ros2-ros-workspace
    - toppra-python >=0.6.9, <0.7.0a0
