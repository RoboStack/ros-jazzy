# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-rqt-tf-tree
  version: 1.1.1
source:
  git: https://github.com/ros2-gbp/rqt_tf_tree-release.git
  tag: release/jazzy/rqt_tf_tree/1.1.1-1
  target_directory: ros2-rqt-tf-tree/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_python.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_python.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://wiki.ros.org/rqt_tf_tree
  repository: https://github.com/ros-visualization/rqt_tf_tree
  license: BSD-3-Clause
  summary: rqt_tf_tree provides a GUI plugin for visualizing the ROS TF frame tree.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - mock
    - numpy
    - pip
    - pytest
    - python
    - ros2-ament-flake8
    - ros2-ament-pep257
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-ros-environment
    - ros2-ros-workspace
    - setuptools
  run:
    - python
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-python-qt-binding
    - ros2-qt-dotgraph
    - ros2-rclpy
    - ros2-ros-workspace
    - ros2-rqt-graph
    - ros2-rqt-gui
    - ros2-rqt-gui-py
    - ros2-tf2-msgs
    - ros2-tf2-ros
    - ros2-tf2-ros-py
