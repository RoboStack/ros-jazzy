# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-rtabmap
  version: 0.23.13
source:
  git: https://github.com/ros2-gbp/rtabmap-release.git
  tag: release/jazzy/rtabmap/0.23.13-1
  target_directory: ros2-rtabmap/src/work
  patches:
    - patch/ros-jazzy-rtabmap.patch

build:
  script: ${{ '$RECIPE_DIR/build_catkin.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_catkin.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://introlab.github.io/rtabmap
  repository: https://github.com/introlab/rtabmap
  license: BSD-3-Clause
  summary: RTAB-Map's standalone library. RTAB-Map is a RGB-D SLAM approach with real-time constraints.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - ${{ 'libdc1394' if not win }}
    - ${{ 'libgl-devel' if linux }}
    - ${{ 'libopengl-devel' if linux }}
    - if: build_platform == target_platform
      then:
        - pkg-config
    - ceres-solver
    - libboost-devel
    - libusb
    - numpy
    - octomap
    - pcl
    - pip
    - proj
    - python
    - ros2-cv-bridge
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-gtsam
    - ros2-libg2o
    - ros2-libpointmatcher
    - ros2-qt-gui-cpp
    - ros2-ros-environment
    - ros2-ros-workspace
    - sqlite 3.*
    - tbb
    - tbb-devel
    - vtk
    - vtk-base
    - zlib
  run:
    - libboost-devel
    - octomap
    - pcl
    - python
    - ros2-cv-bridge
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-gtsam
    - ros2-libg2o
    - ros2-libpointmatcher
    - ros2-qt-gui-cpp
    - ros2-ros-workspace
    - sqlite
    - tbb
    - tbb-devel
    - vtk-base
    - zlib
