# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-moveit-task-constructor-core
  version: 0.1.8
source:
  git: https://github.com/ros2-gbp/moveit_task_constructor-release.git
  tag: release/jazzy/moveit_task_constructor_core/0.1.8-1
  target_directory: ros2-moveit-task-constructor-core/src/work
  patches:
    - patch/ros-jazzy-moveit-task-constructor-core.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://github.com/moveit/moveit_task_constructor
  repository: https://github.com/moveit/moveit_task_constructor
  license: BSD-3-Clause
  summary: MoveIt Task Pipeline
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - fmt
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-gmock
    - ros2-ament-cmake-gtest
    - ros2-ament-cmake-pytest
    - ros2-ament-cmake-python
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-launch-testing-ament-cmake
    - ros2-moveit-configs-utils
    - ros2-moveit-core
    - ros2-moveit-planners-ompl
    - ros2-moveit-py
    - ros2-moveit-resources-fanuc-moveit-config
    - ros2-moveit-ros-planning
    - ros2-moveit-ros-planning-interface
    - ros2-moveit-task-constructor-msgs
    - ros2-py-binding-tools
    - ros2-rclcpp
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-rviz-marker-tools
    - ros2-tf2-eigen
    - ros2-visualization-msgs
  run:
    - fmt
    - python
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-moveit-core
    - ros2-moveit-py
    - ros2-moveit-ros-planning
    - ros2-moveit-ros-planning-interface
    - ros2-moveit-task-constructor-msgs
    - ros2-py-binding-tools
    - ros2-rclcpp
    - ros2-ros-workspace
    - ros2-rviz-marker-tools
    - ros2-tf2-eigen
    - ros2-visualization-msgs
