# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-robot-localization
  version: 3.8.3
source:
  git: https://github.com/ros2-gbp/robot_localization-release.git
  tag: release/jazzy/robot_localization/3.8.3-1
  target_directory: ros2-robot-localization/src/work
  patches:
    - patch/ros-jazzy-robot-localization.win.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://ros.org/wiki/robot_localization
  repository: https://github.com/cra-ros-pkg/robot_localization
  license: Apache-2.0
  summary: Provides nonlinear state estimation through sensor fusion of an abritrary number of sensors.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
    - if: target_platform == 'emscripten-wasm32'
      then:
        - ros2-rosidl-default-generators
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - eigen
    - eigen-abi-devel
    - geographiclib-cpp
    - libboost-devel
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-gtest
    - ros2-ament-lint-auto
    - ros2-ament-lint-common
    - ros2-angles
    - ros2-builtin-interfaces
    - ros2-diagnostic-msgs
    - ros2-diagnostic-updater
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geographic-msgs
    - ros2-geometry-msgs
    - ros2-launch-ros
    - ros2-launch-testing-ament-cmake
    - ros2-message-filters
    - ros2-nav-msgs
    - ros2-rclcpp
    - ros2-rmw-implementation
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-rosidl-default-generators
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-std-srvs
    - ros2-tf2
    - ros2-tf2-eigen
    - ros2-tf2-geometry-msgs
    - ros2-tf2-ros
    - ros2-yaml-cpp-vendor
  run:
    - eigen
    - eigen-abi-devel
    - geographiclib-cpp
    - libboost-devel
    - python
    - ros2-angles
    - ros2-diagnostic-msgs
    - ros2-diagnostic-updater
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geographic-msgs
    - ros2-geometry-msgs
    - ros2-message-filters
    - ros2-nav-msgs
    - ros2-rclcpp
    - ros2-rmw-implementation
    - ros2-ros-workspace
    - ros2-rosidl-default-runtime
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-std-srvs
    - ros2-tf2
    - ros2-tf2-eigen
    - ros2-tf2-geometry-msgs
    - ros2-tf2-ros
    - ros2-yaml-cpp-vendor
