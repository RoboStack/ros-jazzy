# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-rclpy
  version: 7.1.12
source:
  git: https://github.com/ros2-gbp/rclpy-release.git
  tag: release/jazzy/rclpy/7.1.12-1
  target_directory: ros2-rclpy/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/ros2/rclpy
  license: Apache-2.0
  summary: Package containing the Python client.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
    - if: build_platform != target_platform
      then:
        - pybind11
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - pytest
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-gtest
    - ros2-ament-cmake-pytest
    - ros2-ament-lint-auto
    - ros2-ament-lint-common
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-lifecycle-msgs
    - ros2-pybind11-vendor
    - ros2-python-cmake-module
    - ros2-rcl
    - ros2-rcl-action
    - ros2-rcl-interfaces
    - ros2-rcl-lifecycle
    - ros2-rcl-logging-interface
    - ros2-rcl-yaml-param-parser
    - ros2-rcpputils
    - ros2-rcutils
    - ros2-rmw
    - ros2-rmw-implementation
    - ros2-rmw-implementation-cmake
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-rosidl-generator-py
    - ros2-rosidl-runtime-c
    - ros2-test-msgs
    - ros2-unique-identifier-msgs
    - pybind11
  run:
    - python
    - pyyaml
    - ros2-action-msgs
    - ros2-ament-index-python
    - ros2-builtin-interfaces
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-lifecycle-msgs
    - ros2-rcl
    - ros2-rcl-action
    - ros2-rcl-interfaces
    - ros2-rcl-lifecycle
    - ros2-rcl-logging-interface
    - ros2-rcl-yaml-param-parser
    - ros2-rmw
    - ros2-rmw-implementation
    - ros2-ros-workspace
    - ros2-rosgraph-msgs
    - ros2-rosidl-runtime-c
    - ros2-rpyutils
    - ros2-unique-identifier-msgs
tests:
  - python:
      imports:
        - rclpy
      pip_check: false
