# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-ros2cli
  version: 0.32.11
source:
  git: https://github.com/ros2-gbp/ros2cli-release.git
  tag: release/jazzy/ros2cli/0.32.11-1
  target_directory: ros2-ros2cli/src/work
  patches:
    - patch/ros-jazzy-ros2cli.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_python.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_python.bat' }}
  number: 22
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  license: Apache-2.0
  summary: Framework for ROS 2 command line tools.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - pytest
    - pytest-timeout
    - python
    - ros2-ament-copyright
    - ros2-ament-flake8
    - ros2-ament-pep257
    - ros2-ament-xmllint
    - ros2-distro-mutex 0.16.* jazzy_*
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-test-msgs
    - setuptools
  run:
    - argcomplete
    - importlib-metadata
    - packaging
    - psutil
    - python
    - ros2-distro-mutex 0.16.* jazzy_*
    - ros2-rclpy
    - ros2-ros-workspace
tests:
  - script:
      - if: unix
        then:
          - test -f ${PREFIX}/share/bash-completion/completions/ros2-argcomplete.bash
          - test -f ${PREFIX}/share/zsh/site-functions/ros2-argcomplete.zsh
          - grep -q 'source "\$CONDA_PREFIX/share/bash-completion/completions/ros2-argcomplete.bash"' ${PREFIX}/share/zsh/site-functions/ros2-argcomplete.zsh
