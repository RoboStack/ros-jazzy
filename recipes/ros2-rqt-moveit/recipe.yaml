# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-rqt-moveit
  version: 1.0.1
source:
  git: https://github.com/ros2-gbp/rqt_moveit-release.git
  tag: release/jazzy/rqt_moveit/1.0.1-5
  target_directory: ros2-rqt-moveit/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_python.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_python.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://wiki.ros.org/rqt_moveit
  repository: https://github.com/ros-visualization/rqt_moveit
  license: BSD-3-Clause
  summary: "An rqt-based tool that assists monitoring tasks for<a href=\"http://ros.org/wiki/moveit\">MoveIt!</a>motion planner developers and users. Currently the following items are monitored if they are either running, existing or published:<ul><li>Node: /move_group</li><li>Parameter: [/robot_description, /robot_description_semantic]</li><li>Topic: Following types are monitored. Published &quot;names&quot; are ignored.<br/>[sensor_msgs/PointCloud, sensor_msgs/PointCloud2, sensor_msgs/Image, sensor_msgs/CameraInfo]</li></ul>Since this package is not made by the MoveIt! development team (although with assistance from the them), please post issue reports to the designated tracker (not MoveIt!'s main tracker)."
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: target_platform == 'emscripten-wasm32'
      then:
        - ros2-rosidl-default-generators
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-rosidl-default-generators
    - setuptools
  run:
    - python
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-python-qt-binding
    - ros2-rclpy
    - ros2-ros-workspace
    - ros2-rqt-gui
    - ros2-rqt-gui-py
    - ros2-rqt-py-common
    - ros2-rqt-topic
    - ros2-sensor-msgs
