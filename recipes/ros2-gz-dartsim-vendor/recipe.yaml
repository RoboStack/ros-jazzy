# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-gz-dartsim-vendor
  version: 0.0.3
source:
  git: https://github.com/ros2-gbp/gz_dartsim_vendor-release.git
  tag: release/jazzy/gz_dartsim_vendor/0.0.3-1
  target_directory: ros2-gz-dartsim-vendor/src/work
  patches:
    - patch/ros-jazzy-gz-dartsim-vendor.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://dartsim.github.io/
  repository: https://github.com/gazebo-release/gz_dartsim_vendor
  license: Apache-2.0 OR BSD-2-Clause
  summary: Vendor package for the DART physics engine v6.13.2
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - assimp
    - if: build_platform == target_platform
      then:
        - pkg-config
    - bullet
    - dartsim-cpp
    - eigen
    - eigen-abi-devel
    - fcl
    - fmt
    - libboost-devel
    - libccd-double
    - lz4
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-vendor-package
    - ros2-ament-cmake-xmllint
    - ros2-ament-lint-auto
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-ros-environment
    - ros2-ros-workspace
    - tinyxml2
    - urdfdom
  run:
    - assimp
    - bullet
    - dartsim-cpp
    - eigen
    - eigen-abi-devel
    - fcl
    - fmt
    - libboost-devel
    - libccd-double
    - lz4
    - python
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-ros-workspace
    - tinyxml2
    - urdfdom
