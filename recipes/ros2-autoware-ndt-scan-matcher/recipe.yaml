# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-autoware-ndt-scan-matcher
  version: 1.9.0
source:
  git: https://github.com/ros2-gbp/autoware_core-release.git
  tag: release/jazzy/autoware_ndt_scan_matcher/1.9.0-1
  target_directory: ros2-autoware-ndt-scan-matcher/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/autowarefoundation/autoware_core
  license: Apache-2.0 OR BSD-3-Clause
  summary: The autoware_ndt_scan_matcher package
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - fmt
    - libboost-devel
    - libgl-devel
    - libopengl-devel
    - numpy
    - pcl
    - pip
    - python
    - ros2-ament-cmake-auto
    - ros2-ament-cmake-cppcheck
    - ros2-ament-index-cpp
    - ros2-ament-lint-auto
    - ros2-autoware-agnocast-wrapper
    - ros2-autoware-cmake
    - ros2-autoware-internal-debug-msgs
    - ros2-autoware-internal-localization-msgs
    - ros2-autoware-localization-util
    - ros2-autoware-map-msgs
    - ros2-autoware-qos-utils
    - ros2-autoware-utils-diagnostics
    - ros2-autoware-utils-logging
    - ros2-autoware-utils-pcl
    - ros2-autoware-utils-visualization
    - ros2-diagnostic-msgs
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-launch-testing-ament-cmake
    - ros2-nav-msgs
    - ros2-pcl-conversions
    - ros2-rclcpp
    - ros2-rclcpp-components
    - ros2-ros-environment
    - ros2-ros-testing
    - ros2-ros-workspace
    - ros2-sensor-msgs
    - ros2-std-srvs
    - ros2-tf2
    - ros2-tf2-eigen
    - ros2-tf2-geometry-msgs
    - ros2-tf2-ros
    - ros2-tf2-sensor-msgs
    - ros2-visualization-msgs
    - vtk-base
  run:
    - fmt
    - pcl
    - python
    - ros2-autoware-agnocast-wrapper
    - ros2-autoware-internal-debug-msgs
    - ros2-autoware-internal-localization-msgs
    - ros2-autoware-localization-util
    - ros2-autoware-map-msgs
    - ros2-autoware-qos-utils
    - ros2-autoware-utils-diagnostics
    - ros2-autoware-utils-logging
    - ros2-autoware-utils-pcl
    - ros2-autoware-utils-visualization
    - ros2-diagnostic-msgs
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-nav-msgs
    - ros2-pcl-conversions
    - ros2-rclcpp
    - ros2-rclcpp-components
    - ros2-ros-workspace
    - ros2-sensor-msgs
    - ros2-std-srvs
    - ros2-tf2
    - ros2-tf2-eigen
    - ros2-tf2-geometry-msgs
    - ros2-tf2-ros
    - ros2-tf2-sensor-msgs
    - ros2-visualization-msgs
