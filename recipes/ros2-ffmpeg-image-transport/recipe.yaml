# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-ffmpeg-image-transport
  version: 3.0.4
source:
  git: https://github.com/ros2-gbp/ffmpeg_image_transport-release.git
  tag: release/jazzy/ffmpeg_image_transport/3.0.4-1
  target_directory: ros2-ffmpeg-image-transport/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://www.ros.org/wiki/image_transport_plugins
  repository: https://github.com/ros-misc-utilities/ffmpeg_image_transport
  license: Apache-2.0
  summary: ffmpeg_image_transport provides a plugin to image_transport for transparently sending an image stream encoded with ffmpeg.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-black
    - ros2-ament-cmake-clang-format
    - ros2-ament-cmake-gtest
    - ros2-ament-cmake-ros
    - ros2-ament-lint-auto
    - ros2-ament-lint-common
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-ffmpeg-encoder-decoder
    - ros2-ffmpeg-image-transport-msgs
    - ros2-image-transport
    - ros2-pluginlib
    - ros2-rclcpp
    - ros2-rcutils
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-sensor-msgs
    - ros2-std-msgs
  run:
    - python
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-ffmpeg-encoder-decoder
    - ros2-ffmpeg-image-transport-msgs
    - ros2-image-transport
    - ros2-pluginlib
    - ros2-rclcpp
    - ros2-rcutils
    - ros2-ros-workspace
    - ros2-sensor-msgs
    - ros2-std-msgs
