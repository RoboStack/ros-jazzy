# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-realtime-tools
  version: 3.13.0
source:
  git: https://github.com/ros2-gbp/realtime_tools-release.git
  tag: release/jazzy/realtime_tools/3.13.0-1
  target_directory: ros2-realtime-tools/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://control.ros.org
  repository: https://github.com/ros-controls/realtime_tools
  license: BSD-3-Clause
  summary: Contains a set of tools that can be used from a hard realtime thread, without breaking the realtime behavior.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - fmt
    - libboost-devel
    - libcap
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-gmock
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-lifecycle-msgs
    - ros2-rclcpp
    - ros2-rclcpp-action
    - ros2-rclcpp-lifecycle
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-ros2-control-cmake
    - ros2-test-msgs
  run:
    - fmt
    - libboost-devel
    - libcap
    - python
    - ros2-ament-cmake
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-rclcpp
    - ros2-rclcpp-action
    - ros2-ros-workspace
