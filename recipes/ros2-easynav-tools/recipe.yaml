# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-easynav-tools
  version: 0.4.0
source:
  git: https://github.com/EasyNavigation/EasyNavigation-release.git
  tag: release/jazzy/easynav_tools/0.4.0-1
  target_directory: ros2-easynav-tools/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_python.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_python.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/EasyNavigation/EasyNavigation
  license: Apache-2.0
  summary: 'ROS 2 Navigation tools: TUI + ros2cli commands for EasyNav.'
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - pytest
    - python
    - ros2-ament-cmake-pytest
    - ros2-ament-copyright
    - ros2-ament-flake8
    - ros2-ament-pep257
    - ros2-ament-xmllint
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-rclpy
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-rosidl-runtime-py
    - setuptools
  run:
    - python
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-easynav-interfaces
    - ros2-easynav-support-py
    - ros2-geometry-msgs
    - ros2-rclpy
    - ros2-ros-workspace
    - ros2-ros2cli
    - ros2-rosidl-runtime-py
    - typing_extensions
