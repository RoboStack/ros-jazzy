# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-nonpersistent-voxel-layer
  version: 2.5.0
source:
  git: https://github.com/SteveMacenski/nonpersistent_voxel_layer-release.git
  tag: release/jazzy/nonpersistent_voxel_layer/2.5.0-1
  target_directory: ros2-nonpersistent-voxel-layer/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 21
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://wiki.ros.org/non-persisent-voxel-layer
  license: BSD-3-Clause
  summary: include This package provides an implementation of a 3D costmap that takes in sensor data from the world, builds a 3D occupancy grid of the data for only one iteration.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-lint-auto
    - ros2-distro-mutex 0.16.* jazzy_*
    - ros2-geometry-msgs
    - ros2-laser-geometry
    - ros2-map-msgs
    - ros2-nav-msgs
    - ros2-nav2-costmap-2d
    - ros2-nav2-msgs
    - ros2-nav2-voxel-grid
    - ros2-pluginlib
    - ros2-rclcpp
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-tf2
    - ros2-tf2-ros
    - ros2-visualization-msgs
  run:
    - python
    - ros2-distro-mutex 0.16.* jazzy_*
    - ros2-geometry-msgs
    - ros2-laser-geometry
    - ros2-map-msgs
    - ros2-nav-msgs
    - ros2-nav2-costmap-2d
    - ros2-nav2-msgs
    - ros2-nav2-voxel-grid
    - ros2-pluginlib
    - ros2-rclcpp
    - ros2-ros-workspace
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-tf2
    - ros2-tf2-ros
    - ros2-visualization-msgs
