# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-sdformat-vendor
  version: 0.0.14
source:
  git: https://github.com/ros2-gbp/sdformat_vendor-release.git
  tag: release/jazzy/sdformat_vendor/0.0.14-1
  target_directory: ros2-sdformat-vendor/src/work
  patches:
    - patch/ros-jazzy-sdformat-vendor.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://github.com/gazebosim/sdformat
  repository: https://github.com/gazebo-release/sdformat_vendor
  license: Apache-2.0
  summary: 'Vendor package for: sdformat14 14.9.0 SDFormat is an XML file format that describes environments, objects, and robots in a manner suitable for robotic applications'
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
    - if: build_platform != target_platform
      then:
        - pybind11
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - libxml2
    - numpy
    - pip
    - psutil
    - pybind11
    - pytest
    - python
    - ros2-ament-cmake-copyright
    - ros2-ament-cmake-core
    - ros2-ament-cmake-lint-cmake
    - ros2-ament-cmake-test
    - ros2-ament-cmake-vendor-package
    - ros2-ament-cmake-xmllint
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-gz-cmake-vendor
    - ros2-gz-math-vendor
    - ros2-gz-tools-vendor
    - ros2-gz-utils-vendor
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-urdfdom
    - sdformat14
    - tinyxml2
  run:
    - pybind11
    - python
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-gz-cmake-vendor
    - ros2-gz-math-vendor
    - ros2-gz-tools-vendor
    - ros2-gz-utils-vendor
    - ros2-ros-workspace
    - ros2-urdfdom
    - sdformat14
    - tinyxml2
