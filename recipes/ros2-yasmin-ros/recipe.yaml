# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-yasmin-ros
  version: 6.1.2
source:
  git: https://github.com/ros2-gbp/yasmin-release.git
  tag: release/jazzy/yasmin_ros/6.1.2-1
  target_directory: ros2-yasmin-ros/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/uleroboticsgroup/yasmin
  license: Apache-2.0
  summary: YASMIN (Yet Another State MachINe) for ROS 2
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - pytest
    - pytest-cov
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-gtest
    - ros2-ament-cmake-pytest
    - ros2-ament-cmake-python
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-example-interfaces
    - ros2-geometry-msgs
    - ros2-pluginlib
    - ros2-rclcpp
    - ros2-rclcpp-action
    - ros2-rclpy
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-std-msgs
    - ros2-std-srvs
    - ros2-tf2
    - ros2-tf2-msgs
    - ros2-tf2-py
    - ros2-tf2-ros
    - ros2-tf2-ros-py
    - ros2-yasmin
  run:
    - python
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-example-interfaces
    - ros2-geometry-msgs
    - ros2-pluginlib
    - ros2-rclcpp
    - ros2-rclcpp-action
    - ros2-rclpy
    - ros2-ros-workspace
    - ros2-rosidl-runtime-py
    - ros2-std-msgs
    - ros2-std-srvs
    - ros2-tf2
    - ros2-tf2-msgs
    - ros2-tf2-py
    - ros2-tf2-ros
    - ros2-tf2-ros-py
    - ros2-yasmin
