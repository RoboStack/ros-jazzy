# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-autoware-utils-debug
  version: 1.9.0
source:
  git: https://github.com/ros2-gbp/autoware_utils-release.git
  tag: release/jazzy/autoware_utils_debug/1.9.0-1
  target_directory: ros2-autoware-utils-debug/src/work
  patches:
    - patch/ros-jazzy-autoware-utils-debug.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/autowarefoundation/autoware_utils
  license: Apache-2.0
  summary: The autoware_utils_debug package
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - fmt
    - numpy
    - pip
    - python
    - ros2-ament-cmake-auto
    - ros2-ament-cmake-ros
    - ros2-ament-lint-auto
    - ros2-autoware-cmake
    - ros2-autoware-internal-debug-msgs
    - ros2-autoware-internal-msgs
    - ros2-autoware-lint-common
    - ros2-autoware-utils-system
    - ros2-diagnostic-msgs
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-rclcpp
    - ros2-ros-environment
    - ros2-ros-workspace
  run:
    - fmt
    - python
    - ros2-autoware-internal-debug-msgs
    - ros2-autoware-internal-msgs
    - ros2-autoware-utils-system
    - ros2-diagnostic-msgs
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-rclcpp
    - ros2-ros-workspace
