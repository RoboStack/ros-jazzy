# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-depthai-bridge
  version: 2.12.2
source:
  git: https://github.com/luxonis/depthai-ros-release.git
  tag: release/jazzy/depthai_bridge/2.12.2-1
  target_directory: ros2-depthai-bridge/src/work
  patches:
    - patch/ros-jazzy-depthai-bridge.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/luxonis/depthai-ros
  license: MIT
  summary: The depthai_bridge package
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - libgl-devel
    - libopencv
    - libopengl-devel
    - numpy
    - pip
    - py-opencv
    - python
    - ros2-ament-cmake
    - ros2-camera-info-manager
    - ros2-composition-interfaces
    - ros2-cv-bridge
    - ros2-depthai
    - ros2-depthai-ros-msgs
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-ffmpeg-image-transport-msgs
    - ros2-image-transport
    - ros2-rclcpp
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-stereo-msgs
    - ros2-tf2
    - ros2-tf2-geometry-msgs
    - ros2-tf2-ros
    - ros2-vision-msgs
  run:
    - libgl-devel
    - libopencv
    - libopengl-devel
    - py-opencv
    - python
    - ros2-camera-info-manager
    - ros2-composition-interfaces
    - ros2-cv-bridge
    - ros2-depthai
    - ros2-depthai-ros-msgs
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-ffmpeg-image-transport-msgs
    - ros2-image-transport
    - ros2-rclcpp
    - ros2-robot-state-publisher
    - ros2-ros-workspace
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-stereo-msgs
    - ros2-tf2
    - ros2-tf2-geometry-msgs
    - ros2-tf2-ros
    - ros2-vision-msgs
    - ros2-xacro
