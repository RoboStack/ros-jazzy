# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-foxglove-bridge
  version: 3.6.0
source:
  git: https://github.com/ros2-gbp/foxglove_bridge-release.git
  tag: release/jazzy/foxglove_bridge/3.6.0-1
  target_directory: ros2-foxglove-bridge/src/work
  patches:
    - patch/ros-jazzy-foxglove-bridge.patch
    - patch/ros-jazzy-foxglove-bridge.win.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://github.com/foxglove/foxglove-sdk
  repository: https://github.com/foxglove/foxglove-sdk
  license: MIT
  summary: ROS Foxglove Bridge
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - asio
    - if: build_platform == target_platform
      then:
        - pkg-config
    - nlohmann_json
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-gtest
    - ros2-ament-index-cpp
    - ros2-ament-lint-auto
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-rcl-interfaces
    - ros2-rclcpp
    - ros2-rclcpp-components
    - ros2-rcpputils
    - ros2-rcutils
    - ros2-resource-retriever
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-rosgraph-msgs
    - ros2-rosidl-typesupport-introspection-cpp
    - ros2-rosx-introspection
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-std-srvs
    - ros2-test-msgs
    - websocketpp
  run:
    - python
    - ros2-ament-index-cpp
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-rcl-interfaces
    - ros2-rclcpp
    - ros2-rclcpp-components
    - ros2-rcpputils
    - ros2-rcutils
    - ros2-resource-retriever
    - ros2-ros-workspace
    - ros2-rosgraph-msgs
    - ros2-rosidl-typesupport-introspection-cpp
    - ros2-rosx-introspection
    - ros2-service-msgs
    - ros2-std-msgs
