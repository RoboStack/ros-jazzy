# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-gtsam
  version: 4.2.1

build:
  number: 25
  script: ''
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/borglab/gtsam
  license: BSD-3-Clause
  summary: gtsam
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build: []
  host:
    - eigen
    - eigen-abi-devel
    - libboost-devel
    - libboost-python-devel
    - python
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-ros-environment
    - ros2-ros-workspace
    - tbb
    - tbb-devel
  run:
    - eigen
    - eigen-abi-devel
    - gtsam >=4.2.1, <4.3.0a0
    - libboost-devel
    - libboost-python-devel
    - python
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-ros-workspace
    - tbb
    - tbb-devel
