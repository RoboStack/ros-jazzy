# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-ur-robot-driver
  version: 3.9.0
source:
  git: https://github.com/ros2-gbp/Universal_Robots_ROS2_Driver-release.git
  tag: release/jazzy/ur_robot_driver/3.9.0-1
  target_directory: ros2-ur-robot-driver/src/work
  patches:
    - patch/ros-jazzy-ur-robot-driver.win.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://docs.universal-robots.com/Universal_Robots_ROS_Documentation/
  repository: https://github.com/UniversalRobots/Universal_Robots_ROS2_Driver
  license: BSD-3-Clause
  summary: The ROS 2 driver for Universal Robots manipulators. This driver supports all robot models as listed in the documentation. For robot controllers, PolyScope X, PolyScope 5 and CB3 controllers are supported.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-python
    - ros2-backward-ros
    - ros2-control-msgs
    - ros2-controller-manager
    - ros2-controller-manager-msgs
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-hardware-interface
    - ros2-launch-testing-ament-cmake
    - ros2-pluginlib
    - ros2-rclcpp
    - ros2-rclcpp-action
    - ros2-rclcpp-lifecycle
    - ros2-rclpy
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-ros2run
    - ros2-std-msgs
    - ros2-std-srvs
    - ros2-tf2-geometry-msgs
    - ros2-ur-client-library
    - ros2-ur-controllers
    - ros2-ur-dashboard-msgs
    - ros2-ur-description
    - ros2-ur-msgs
  run:
    - python
    - ros2-backward-ros
    - ros2-control-msgs
    - ros2-controller-manager
    - ros2-controller-manager-msgs
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-effort-controllers
    - ros2-force-torque-sensor-broadcaster
    - ros2-geometry-msgs
    - ros2-hardware-interface
    - ros2-joint-state-broadcaster
    - ros2-joint-state-publisher
    - ros2-joint-trajectory-controller
    - ros2-launch
    - ros2-launch-ros
    - ros2-pluginlib
    - ros2-pose-broadcaster
    - ros2-position-controllers
    - ros2-rclcpp
    - ros2-rclcpp-action
    - ros2-rclcpp-lifecycle
    - ros2-rclpy
    - ros2-robot-state-publisher
    - ros2-ros-workspace
    - ros2-ros2-controllers-test-nodes
    - ros2-rviz2
    - ros2-std-msgs
    - ros2-std-srvs
    - ros2-tf2-geometry-msgs
    - ros2-ur-client-library
    - ros2-ur-controllers
    - ros2-ur-dashboard-msgs
    - ros2-ur-description
    - ros2-ur-msgs
    - ros2-urdf
    - ros2-velocity-controllers
    - ros2-xacro
