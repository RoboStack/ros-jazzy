# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-ros2-medkit-serialization
  version: 0.6.0
source:
  git: https://github.com/ros2-gbp/ros2_medkit-release.git
  tag: release/jazzy/ros2_medkit_serialization/0.6.0-1
  target_directory: ros2-ros2-medkit-serialization/src/work
  patches:
    - patch/ros-jazzy-ros2-medkit-serialization.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/selfpatch/ros2_medkit
  license: Apache-2.0
  summary: Runtime JSON to ROS 2 message serialization library
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - nlohmann_json
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-clang-format
    - ros2-ament-cmake-clang-tidy
    - ros2-ament-cmake-gtest
    - ros2-ament-lint-auto
    - ros2-ament-lint-common
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-rclcpp
    - ros2-rcpputils
    - ros2-rcutils
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-ros2-medkit-cmake
    - ros2-rosidl-runtime-c
    - ros2-rosidl-runtime-cpp
    - ros2-rosidl-typesupport-introspection-c
    - ros2-rosidl-typesupport-introspection-cpp
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-std-srvs
    - ros2-test-msgs
    - ros2-yaml-cpp-vendor
  run:
    - nlohmann_json
    - python
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-rclcpp
    - ros2-rcpputils
    - ros2-rcutils
    - ros2-ros-workspace
    - ros2-rosidl-runtime-c
    - ros2-rosidl-runtime-cpp
    - ros2-rosidl-typesupport-introspection-c
    - ros2-rosidl-typesupport-introspection-cpp
    - ros2-yaml-cpp-vendor
