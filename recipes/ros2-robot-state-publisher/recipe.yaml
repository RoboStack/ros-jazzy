# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-robot-state-publisher
  version: 3.3.4
source:
  git: https://github.com/ros2-gbp/robot_state_publisher-release.git
  tag: release/jazzy/robot_state_publisher/3.3.4-1
  target_directory: ros2-robot-state-publisher/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/ros/robot_state_publisher
  license: BSD-3-Clause
  summary: This package take the joint angles of a robot as input, and publishes the 3D poses of the robot links to tf2, using a kinematic tree model of the robot.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-gtest
    - ros2-ament-lint-auto
    - ros2-ament-lint-common
    - ros2-builtin-interfaces
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-kdl-parser
    - ros2-launch-ros
    - ros2-launch-testing-ament-cmake
    - ros2-orocos-kdl-vendor
    - ros2-rcl-interfaces
    - ros2-rclcpp
    - ros2-rclcpp-components
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-tf2-ros
    - ros2-urdf
  run:
    - python
    - ros2-builtin-interfaces
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-kdl-parser
    - ros2-orocos-kdl-vendor
    - ros2-rcl-interfaces
    - ros2-rclcpp
    - ros2-rclcpp-components
    - ros2-ros-workspace
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-tf2-ros
    - ros2-urdf
tests:
  - script:
      - if: osx
        then: export ROS_LOCALHOST_ONLY=1 RMW_IMPLEMENTATION=rmw_cyclonedds_cpp && launch_test robot_state_publisher_smoke_test_launch.py
        else: launch_test robot_state_publisher_smoke_test_launch.py
    requirements:
      run:
        - ros-jazzy-launch-testing-ros
        - ros-jazzy-rcl-interfaces
        - ros-jazzy-rclpy
    files:
      recipe:
        - robot_state_publisher_smoke_test_launch.py
