# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-pick-ik
  version: 1.1.2
source:
  git: https://github.com/ros2-gbp/pick_ik-release.git
  tag: release/jazzy/pick_ik/1.1.2-1
  target_directory: ros2-pick-ik/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/PickNikRobotics/pick_ik
  license: BSD-3-Clause
  summary: Inverse Kinematics solver for MoveIt
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - fmt
    - numpy
    - pip
    - python
    - range-v3
    - ros2-ament-cmake-ros
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-generate-parameter-library
    - ros2-moveit-core
    - ros2-moveit-resources-panda-moveit-config
    - ros2-pluginlib
    - ros2-rclcpp
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-rsl
    - ros2-tf2-geometry-msgs
    - ros2-tf2-kdl
    - ros2-tl-expected
  run:
    - fmt
    - python
    - range-v3
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-generate-parameter-library
    - ros2-moveit-core
    - ros2-pluginlib
    - ros2-rclcpp
    - ros2-ros-workspace
    - ros2-rsl
    - ros2-tf2-geometry-msgs
    - ros2-tf2-kdl
    - ros2-tl-expected
