# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-roboplan-example-models
  version: 0.6.1

build:
  number: 21
  script: ''
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://roboplan.readthedocs.io
  repository: https://github.com/open-planning/roboplan
  license: MIT
  summary: Robot descriptions for RoboPlan testing and examples.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build: []
  host:
    - nanobind
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-python
    - ros2-distro-mutex 0.16.* jazzy_*
    - ros2-ros-environment
    - ros2-ros-workspace
    - typing_extensions
  run:
    - python
    - roboplan-example-models-python >=0.6.1, <0.7.0a0
    - ros2-distro-mutex 0.16.* jazzy_*
    - ros2-ros-workspace
