# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-cartographer-ros
  version: 2.0.9003
source:
  git: https://github.com/ros2-gbp/cartographer_ros-release.git
  tag: release/jazzy/cartographer_ros/2.0.9003-2
  target_directory: ros2-cartographer-ros/src/work
  patches:
    - patch/ros-jazzy-cartographer-ros.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://github.com/cartographer-project/cartographer_ros
  repository: https://github.com/ros2/cartographer_ros
  license: Apache-2.0
  summary: Cartographer is a system that provides real-time simultaneous localization and mapping (SLAM) in 2D and 3D across multiple platforms and sensor configurations. This package provides Cartographer's ROS integration.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - cartographer 2.*
    - eigen
    - eigen-abi-devel
    - gflags
    - glog
    - gmock
    - libabseil
    - libboost-devel
    - libgl-devel
    - libopengl-devel
    - numpy
    - pcl
    - pip
    - python
    - ros2-ament-cmake
    - ros2-builtin-interfaces
    - ros2-cartographer
    - ros2-cartographer-ros-msgs
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-nav-msgs
    - ros2-pcl-conversions
    - ros2-rclcpp
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-rosbag2-cpp
    - ros2-rosbag2-storage
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-tf2
    - ros2-tf2-eigen
    - ros2-tf2-msgs
    - ros2-tf2-ros
    - ros2-urdf
    - ros2-visualization-msgs
    - sphinx
    - vtk-base
  run:
    - eigen
    - eigen-abi-devel
    - gflags
    - glog
    - libabseil
    - libboost-devel
    - libgl-devel
    - libopengl-devel
    - pcl
    - python
    - ros2-builtin-interfaces
    - ros2-cartographer
    - ros2-cartographer-ros-msgs
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-launch
    - ros2-nav-msgs
    - ros2-pcl-conversions
    - ros2-rclcpp
    - ros2-robot-state-publisher
    - ros2-ros-workspace
    - ros2-rosbag2-cpp
    - ros2-rosbag2-storage
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-tf2
    - ros2-tf2-eigen
    - ros2-tf2-msgs
    - ros2-tf2-ros
    - ros2-urdf
    - ros2-visualization-msgs
    - vtk-base
