# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-plansys2-planner
  version: 2.0.18
source:
  git: https://github.com/ros2-gbp/ros2_planning_system-release.git
  tag: release/jazzy/plansys2_planner/2.0.18-1
  target_directory: ros2-plansys2-planner/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/PlanSys2/ros2_planning_system
  license: Apache-2.0
  summary: This package contains the PDDL-based Planner module for the ROS2 Planning System
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-gtest
    - ros2-ament-index-cpp
    - ros2-ament-lint-auto
    - ros2-ament-lint-common
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-lifecycle-msgs
    - ros2-plansys2-core
    - ros2-plansys2-domain-expert
    - ros2-plansys2-msgs
    - ros2-plansys2-pddl-parser
    - ros2-plansys2-popf-plan-solver
    - ros2-plansys2-problem-expert
    - ros2-pluginlib
    - ros2-rclcpp
    - ros2-rclcpp-action
    - ros2-rclcpp-lifecycle
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-ros2run
    - ros2-std-msgs
  run:
    - python
    - ros2-ament-index-cpp
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-lifecycle-msgs
    - ros2-plansys2-core
    - ros2-plansys2-domain-expert
    - ros2-plansys2-msgs
    - ros2-plansys2-pddl-parser
    - ros2-plansys2-popf-plan-solver
    - ros2-plansys2-problem-expert
    - ros2-pluginlib
    - ros2-rclcpp
    - ros2-rclcpp-action
    - ros2-rclcpp-lifecycle
    - ros2-ros-workspace
    - ros2-std-msgs
