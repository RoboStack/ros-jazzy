# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-image-proc
  version: 5.0.13
source:
  git: https://github.com/ros2-gbp/image_pipeline-release.git
  tag: release/jazzy/image_proc/5.0.13-1
  target_directory: ros2-image-proc/src/work
  patches:
    - patch/ros-jazzy-image-proc.patch
    - patch/ros-jazzy-image-proc.win.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://index.ros.org/p/image_proc/
  repository: https://github.com/ros-perception/image_pipeline
  license: BSD-3-Clause
  summary: Single image rectification and color processing.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - libopencv
    - numpy
    - pip
    - py-opencv
    - python
    - ros2-ament-cmake-auto
    - ros2-ament-lint-auto
    - ros2-ament-lint-common
    - ros2-camera-calibration-parsers
    - ros2-cv-bridge
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-image-geometry
    - ros2-image-transport
    - ros2-rclcpp
    - ros2-rclcpp-components
    - ros2-rcutils
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-sensor-msgs
    - ros2-tf2
    - ros2-tf2-geometry-msgs
    - ros2-tracetools-image-pipeline
  run:
    - libopencv
    - py-opencv
    - python
    - ros2-camera-calibration-parsers
    - ros2-cv-bridge
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-image-geometry
    - ros2-image-transport
    - ros2-rclcpp
    - ros2-rclcpp-components
    - ros2-rcutils
    - ros2-ros-workspace
    - ros2-sensor-msgs
    - ros2-tf2
    - ros2-tf2-geometry-msgs
    - ros2-tracetools-image-pipeline
