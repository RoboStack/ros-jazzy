# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-py-trees-ros
  version: 2.6.0
source:
  git: https://github.com/ros2-gbp/py_trees_ros-release.git
  tag: release/jazzy/py_trees_ros/2.6.0-1
  target_directory: ros2-py-trees-ros/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_python.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_python.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://py-trees-ros.readthedocs.io/en/release-1.2.x/
  repository: https://github.com/splintered-reality/py_trees_ros
  license: BSD-3-Clause
  summary: ROS 2 extensions and behaviours for py_trees.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - pytest
    - python
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-py-trees
    - ros2-py-trees-ros-interfaces
    - ros2-rcl-interfaces
    - ros2-rclpy
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-ros2topic
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-std-srvs
    - ros2-tf2-ros-py
    - ros2-unique-identifier-msgs
    - setuptools
  run:
    - python
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-py-trees
    - ros2-py-trees-ros-interfaces
    - ros2-rcl-interfaces
    - ros2-rclpy
    - ros2-ros-workspace
    - ros2-ros2topic
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-std-srvs
    - ros2-tf2-ros-py
    - ros2-unique-identifier-msgs
