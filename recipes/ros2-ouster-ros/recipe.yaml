# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-ouster-ros
  version: 0.15.1
source:
  git: https://github.com/ros2-gbp/ouster-ros-release.git
  tag: release/jazzy/ouster_ros/0.15.1-1
  target_directory: ros2-ouster-ros/src/work
  patches:
    - patch/ros-jazzy-ouster-ros.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/ouster-lidar/ouster-ros
  license: BSD-3-Clause
  summary: Ouster ROS2 driver
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
    - if: target_platform == 'emscripten-wasm32'
      then:
        - ros2-rosidl-default-generators
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - eigen
    - eigen-abi-devel
    - fmt
    - gtest
    - jsoncpp
    - libboost-devel
    - libcurl
    - libgl-devel
    - libopengl-devel
    - libtins
    - libzip
    - numpy
    - pcl
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-gtest
    - ros2-class-loader
    - ros2-cv-bridge
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-ouster-sensor-msgs
    - ros2-pcl-conversions
    - ros2-rclcpp
    - ros2-rclcpp-components
    - ros2-rclcpp-lifecycle
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-rosidl-default-generators
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-std-srvs
    - ros2-tf2-eigen
    - ros2-tf2-ros
    - spdlog
    - vtk-base
  run:
    - fmt
    - jsoncpp
    - libcurl
    - python
    - ros2-class-loader
    - ros2-cv-bridge
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-launch
    - ros2-launch-ros
    - ros2-ouster-sensor-msgs
    - ros2-pcl-conversions
    - ros2-rclcpp
    - ros2-rclcpp-components
    - ros2-rclcpp-lifecycle
    - ros2-ros-workspace
    - ros2-rosidl-default-runtime
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-std-srvs
    - ros2-tf2-ros
    - spdlog
