# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-nav2-route
  version: 1.3.13
source:
  git: https://github.com/SteveMacenski/navigation2-release.git
  tag: release/jazzy/nav2_route/1.3.13-1
  target_directory: ros2-nav2-route/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/ros-planning/navigation2
  license: Apache-2.0
  summary: A Route Graph planner to compliment the Planner Server
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - nanoflann
    - nlohmann_json
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-gtest
    - ros2-ament-cmake-pytest
    - ros2-ament-lint-auto
    - ros2-ament-lint-common
    - ros2-angles
    - ros2-backward-ros
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-launch
    - ros2-launch-testing
    - ros2-nav-msgs
    - ros2-nav2-common
    - ros2-nav2-core
    - ros2-nav2-costmap-2d
    - ros2-nav2-msgs
    - ros2-nav2-util
    - ros2-pluginlib
    - ros2-rclcpp
    - ros2-rclcpp-lifecycle
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-std-msgs
    - ros2-tf2
    - ros2-tf2-ros
    - ros2-visualization-msgs
  run:
    - nanoflann
    - nlohmann_json
    - python
    - ros2-angles
    - ros2-backward-ros
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-nav-msgs
    - ros2-nav2-core
    - ros2-nav2-costmap-2d
    - ros2-nav2-msgs
    - ros2-nav2-util
    - ros2-pluginlib
    - ros2-rclcpp
    - ros2-rclcpp-lifecycle
    - ros2-ros-workspace
    - ros2-std-msgs
    - ros2-tf2
    - ros2-tf2-ros
    - ros2-visualization-msgs
