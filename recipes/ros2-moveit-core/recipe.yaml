# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-moveit-core
  version: 2.12.4
source:
  git: https://github.com/ros2-gbp/moveit2-release.git
  tag: release/jazzy/moveit_core/2.12.4-1
  target_directory: ros2-moveit-core/src/work
  patches:
    - patch/ros-jazzy-moveit-core.patch
    - patch/ros-jazzy-moveit-core.win.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://moveit.ros.org
  repository: https://github.com/ros-planning/moveit2
  license: BSD-3-Clause
  summary: Core libraries used by MoveIt
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - assimp
    - if: build_platform == target_platform
      then:
        - pkg-config
    - bullet
    - eigen
    - eigen-abi-devel
    - fcl
    - libboost-devel
    - libboost-python-devel
    - numpy
    - octomap
    - pip
    - pkg-config
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-gmock
    - ros2-ament-cmake-google-benchmark
    - ros2-ament-cmake-gtest
    - ros2-ament-index-cpp
    - ros2-angles
    - ros2-common-interfaces
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-eigen-stl-containers
    - ros2-eigen3-cmake-module
    - ros2-generate-parameter-library
    - ros2-geometric-shapes
    - ros2-geometry-msgs
    - ros2-google-benchmark-vendor
    - ros2-kdl-parser
    - ros2-launch-testing-ament-cmake
    - ros2-moveit-common
    - ros2-moveit-msgs
    - ros2-moveit-resources-panda-moveit-config
    - ros2-moveit-resources-pr2-description
    - ros2-octomap-msgs
    - ros2-orocos-kdl-vendor
    - ros2-osqp-vendor
    - ros2-pluginlib
    - ros2-random-numbers
    - ros2-rcl-interfaces
    - ros2-rclcpp
    - ros2-rclpy
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-rsl
    - ros2-ruckig
    - ros2-sensor-msgs
    - ros2-shape-msgs
    - ros2-srdfdom
    - ros2-std-msgs
    - ros2-tf2
    - ros2-tf2-eigen
    - ros2-tf2-geometry-msgs
    - ros2-tf2-kdl
    - ros2-trajectory-msgs
    - ros2-urdf
    - ros2-urdfdom
    - ros2-urdfdom-headers
    - ros2-visualization-msgs
  run:
    - assimp
    - bullet
    - eigen
    - eigen-abi-devel
    - fcl
    - libboost-devel
    - libboost-python-devel
    - octomap
    - python
    - ros2-angles
    - ros2-common-interfaces
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-eigen-stl-containers
    - ros2-eigen3-cmake-module
    - ros2-generate-parameter-library
    - ros2-geometric-shapes
    - ros2-geometry-msgs
    - ros2-google-benchmark-vendor
    - ros2-kdl-parser
    - ros2-moveit-common
    - ros2-moveit-msgs
    - ros2-octomap-msgs
    - ros2-osqp-vendor
    - ros2-pluginlib
    - ros2-random-numbers
    - ros2-rclcpp
    - ros2-ros-workspace
    - ros2-rsl
    - ros2-ruckig
    - ros2-sensor-msgs
    - ros2-shape-msgs
    - ros2-srdfdom
    - ros2-std-msgs
    - ros2-tf2
    - ros2-tf2-eigen
    - ros2-tf2-geometry-msgs
    - ros2-tf2-kdl
    - ros2-trajectory-msgs
    - ros2-urdf
    - ros2-urdfdom
    - ros2-urdfdom-headers
    - ros2-visualization-msgs
