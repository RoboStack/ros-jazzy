# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-rtest
  version: 0.2.5
source:
  git: https://github.com/ros2-gbp/rtest-release.git
  tag: release/jazzy/rtest/0.2.5-1
  target_directory: ros2-rtest/src/work
  patches:
    - patch/ros-jazzy-rtest.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/Beam-and-Spyrosoft/rtest
  license: Apache-2.0
  summary: This framework enables writing reliable, fully repeatable tests for C++ ROS 2 implementations.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - gmock
    - libboost-devel
    - numpy
    - pip
    - python
    - ros2-action-msgs
    - ros2-ament-clang-tidy
    - ros2-ament-cmake
    - ros2-ament-cmake-copyright
    - ros2-ament-cmake-gmock
    - ros2-ament-cmake-ros
    - ros2-ament-lint-auto
    - ros2-ament-lint-common
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-example-interfaces
    - ros2-rcl
    - ros2-rcl-action
    - ros2-rclcpp
    - ros2-rclcpp-action
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-std-msgs
    - ros2-std-srvs
  run:
    - python
    - ros2-action-msgs
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-rcl
    - ros2-rcl-action
    - ros2-rclcpp
    - ros2-rclcpp-action
    - ros2-ros-workspace
