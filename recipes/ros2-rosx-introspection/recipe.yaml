# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-rosx-introspection
  version: 2.3.0
source:
  git: https://github.com/ros2-gbp/rosx_introspection-release.git
  tag: release/jazzy/rosx_introspection/2.3.0-1
  target_directory: ros2-rosx-introspection/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/facontidavide/rosx_introspection
  license: MIT
  summary: Parse any ROS/ROS2 message without compile-time information
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - rapidjson
    - ros2-ament-cmake
    - ros2-ament-cmake-gtest
    - ros2-ament-index-cpp
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-rclcpp
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-rosbag2-cpp
    - ros2-sensor-msgs
  run:
    - python
    - rapidjson
    - ros2-ament-index-cpp
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-rclcpp
    - ros2-ros-workspace
    - ros2-rosbag2-cpp
