# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-microstrain-inertial-rqt
  version: 4.10.0
source:
  git: https://github.com/ros2-gbp/microstrain_inertial-release.git
  tag: release/jazzy/microstrain_inertial_rqt/4.10.0-2
  target_directory: ros2-microstrain-inertial-rqt/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_python.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_python.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://github.com/LORD-MicroStrain/microstrain_inertial
  repository: https://github.com/LORD-MicroStrain/microstrain_inertial
  license: BSD-3-Clause
  summary: The microstrain_inertial_rqt package provides several RQT widgets to view the status of Microstrain devices
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-microstrain-inertial-msgs
    - ros2-nav-msgs
    - ros2-rclpy
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-rqt-gui
    - ros2-rqt-gui-py
    - ros2-std-msgs
    - setuptools
  run:
    - python
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-microstrain-inertial-msgs
    - ros2-nav-msgs
    - ros2-rclpy
    - ros2-ros-workspace
    - ros2-rqt-gui
    - ros2-rqt-gui-py
    - ros2-std-msgs
