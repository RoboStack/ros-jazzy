# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-kinova-gen3-7dof-robotiq-2f-85-moveit-config
  version: 0.2.6
source:
  git: https://github.com/ros2-gbp/ros2_kortex-release.git
  tag: release/jazzy/kinova_gen3_7dof_robotiq_2f_85_moveit_config/0.2.6-1
  target_directory: ros2-kinova-gen3-7dof-robotiq-2f-85-moveit-config/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://moveit.ros.org/
  repository: https://github.com/Kinovarobotics/ros2_kortex
  license: BSD-3-Clause
  summary: An automatically generated package with all the configuration and launch files for using the gen3 with the MoveIt Motion Planning Framework
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-ros-environment
    - ros2-ros-workspace
  run:
    - python
    - ros2-controller-manager
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-joint-state-publisher
    - ros2-joint-state-publisher-gui
    - ros2-joint-trajectory-controller
    - ros2-kortex-description
    - ros2-moveit-configs-utils
    - ros2-moveit-kinematics
    - ros2-moveit-planners
    - ros2-moveit-ros-move-group
    - ros2-moveit-ros-visualization
    - ros2-moveit-ros-warehouse
    - ros2-moveit-setup-assistant
    - ros2-moveit-simple-controller-manager
    - ros2-picknik-reset-fault-controller
    - ros2-picknik-twist-controller
    - ros2-robot-state-publisher
    - ros2-ros-workspace
    - ros2-rviz-common
    - ros2-rviz-default-plugins
    - ros2-rviz2
    - ros2-tf2-ros
    - ros2-xacro
