# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-rclcpp
  version: 28.1.22
source:
  git: https://github.com/ros2-gbp/rclcpp-release.git
  tag: release/jazzy/rclcpp/28.1.22-1
  target_directory: ros2-rclcpp/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/ros2/rclcpp
  license: Apache-2.0
  summary: The ROS client library in C++.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
    - if: target_platform != 'emscripten-wasm32'
      then:
        - ros2-mimick-vendor
    - if: target_platform == 'emscripten-wasm32'
      then:
        - ros2-rosidl-default-generators
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros2-ament-cmake-gen-version-h
    - ros2-ament-cmake-gmock
    - ros2-ament-cmake-google-benchmark
    - ros2-ament-cmake-gtest
    - ros2-ament-cmake-ros
    - ros2-ament-index-cpp
    - ros2-ament-lint-auto
    - ros2-ament-lint-common
    - ros2-builtin-interfaces
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-libstatistics-collector
    - ros2-performance-test-fixture
    - ros2-rcl
    - ros2-rcl-interfaces
    - ros2-rcl-logging-interface
    - ros2-rcl-yaml-param-parser
    - ros2-rcpputils
    - ros2-rcutils
    - ros2-rmw
    - ros2-rmw-implementation-cmake
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-rosgraph-msgs
    - ros2-rosidl-default-generators
    - ros2-rosidl-dynamic-typesupport
    - ros2-rosidl-runtime-c
    - ros2-rosidl-runtime-cpp
    - ros2-rosidl-typesupport-c
    - ros2-rosidl-typesupport-cpp
    - ros2-statistics-msgs
    - ros2-test-msgs
    - ros2-tracetools
  run:
    - python
    - ros2-ament-index-cpp
    - ros2-builtin-interfaces
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-libstatistics-collector
    - ros2-rcl
    - ros2-rcl-interfaces
    - ros2-rcl-logging-interface
    - ros2-rcl-yaml-param-parser
    - ros2-rcpputils
    - ros2-rcutils
    - ros2-rmw
    - ros2-ros-workspace
    - ros2-rosgraph-msgs
    - ros2-rosidl-dynamic-typesupport
    - ros2-rosidl-runtime-c
    - ros2-rosidl-runtime-cpp
    - ros2-rosidl-typesupport-c
    - ros2-rosidl-typesupport-cpp
    - ros2-statistics-msgs
    - ros2-tracetools
