# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-rosidl-typesupport-c
  version: 3.2.3
source:
  git: https://github.com/ros2-gbp/rosidl_typesupport-release.git
  tag: release/jazzy/rosidl_typesupport_c/3.2.3-1
  target_directory: ros2-rosidl-typesupport-c/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/ros2/rosidl_typesupport
  license: Apache-2.0
  summary: Generate the type support for C messages.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
    - if: target_platform != 'emscripten-wasm32'
      then:
        - ros2-mimick-vendor
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros2-ament-cmake-core
    - ros2-ament-cmake-ros
    - ros2-ament-lint-auto
    - ros2-ament-lint-common
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-performance-test-fixture
    - ros2-rcpputils
    - ros2-rcutils
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-rosidl-runtime-c
    - ros2-rosidl-typesupport-fastrtps-c
    - ros2-rosidl-typesupport-introspection-c
  run:
    - python
    - ros2-ament-cmake-core
    - ros2-ament-index-python
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-rcpputils
    - ros2-rcutils
    - ros2-ros-workspace
    - ros2-rosidl-cli
    - ros2-rosidl-generator-c
    - ros2-rosidl-pycommon
    - ros2-rosidl-runtime-c
    - ros2-rosidl-typesupport-fastrtps-c
    - ros2-rosidl-typesupport-interface
    - ros2-rosidl-typesupport-introspection-c
