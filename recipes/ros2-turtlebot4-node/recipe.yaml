# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-turtlebot4-node
  version: 2.1.1
source:
  git: https://github.com/ros2-gbp/turtlebot4-release.git
  tag: release/jazzy/turtlebot4_node/2.1.1-1
  target_directory: ros2-turtlebot4-node/src/work
  patches:
    - patch/ros-jazzy-turtlebot4-node.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/turtlebot/turtlebot4
  license: Apache-2.0
  summary: Turtlebot4 Node
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-lint-auto
    - ros2-ament-lint-common
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-irobot-create-msgs
    - ros2-rclcpp
    - ros2-rclcpp-action
    - ros2-rcutils
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-std-srvs
    - ros2-turtlebot4-msgs
  run:
    - python
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-irobot-create-msgs
    - ros2-rclcpp
    - ros2-rclcpp-action
    - ros2-rcutils
    - ros2-ros-workspace
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-std-srvs
    - ros2-turtlebot4-msgs
tests:
  - script:
      - python -c "import os,signal,subprocess,sys,time; kw={'creationflags':subprocess.CREATE_NEW_PROCESS_GROUP} if os.name=='nt' else {'start_new_session':True}; p=subprocess.Popen(['ros2','run','turtlebot4_node','turtlebot4_node'],**kw); time.sleep(3); rc=p.poll(); (subprocess.run(['taskkill','/F','/T','/PID',str(p.pid)]) if os.name=='nt' else os.killpg(p.pid,signal.SIGKILL)) if rc is None else None; sys.exit(0 if rc is None else rc)"
    requirements:
      run:
        - ros-jazzy-ros2run
