# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-libmavconn
  version: 2.16.0
source:
  git: https://github.com/ros2-gbp/mavros-release.git
  tag: release/jazzy/libmavconn/2.16.0-1
  target_directory: ros2-libmavconn/src/work
  patches:
    - patch/ros-jazzy-libmavconn.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://wiki.ros.org/mavros
  repository: https://github.com/mavlink/mavros
  license: GPL-3.0-only OR LGPL-3.0-only OR BSD-3-Clause
  summary: MAVLink communication library. This library provide unified connection handling classes and URL to connection object mapper. This library can be used in standalone programs.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - asio
    - if: build_platform == target_platform
      then:
        - pkg-config
    - console_bridge
    - empy
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-google-benchmark
    - ros2-ament-cmake-gtest
    - ros2-ament-cmake-pytest
    - ros2-ament-lint-auto
    - ros2-ament-lint-common
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-mavlink
    - ros2-ros-environment
    - ros2-ros-workspace
  run:
    - asio
    - console_bridge
    - python
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-mavlink
    - ros2-ros-workspace
