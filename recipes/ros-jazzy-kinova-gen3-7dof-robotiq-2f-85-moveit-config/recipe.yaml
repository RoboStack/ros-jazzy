# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-jazzy-kinova-gen3-7dof-robotiq-2f-85-moveit-config
  version: 0.2.6

build:
  script: ''
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  summary: Compatibility package for ros2-kinova-gen3-7dof-robotiq-2f-85-moveit-config
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  run:
    - ros2-kinova-gen3-7dof-robotiq-2f-85-moveit-config ==0.2.6
