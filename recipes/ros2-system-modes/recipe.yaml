# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-system-modes
  version: 0.9.0
source:
  git: https://github.com/ros2-gbp/system_modes-release.git
  tag: release/jazzy/system_modes/0.9.0-6
  target_directory: ros2-system-modes/src/work
  patches:
    - patch/ros-jazzy-system-modes.win.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://micro.ros.org/docs/concepts/client_library/lifecycle_and_system_modes/
  repository: https://github.com/micro-ROS/system_modes
  license: Apache-2.0
  summary: The system modes concept assumes that a robotics system is built from components with a lifecycle. It adds a notion of (sub-)systems, hiararchically grouping these nodes, as well as a notion of modes that determine the configuration of these nodes and (sub-)systems in terms of their parameter values.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-cppcheck
    - ros2-ament-cmake-cpplint
    - ros2-ament-cmake-flake8
    - ros2-ament-cmake-gmock
    - ros2-ament-cmake-gtest
    - ros2-ament-cmake-pep257
    - ros2-ament-cmake-uncrustify
    - ros2-ament-index-python
    - ros2-ament-lint-auto
    - ros2-builtin-interfaces
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-launch-testing-ament-cmake
    - ros2-launch-testing-ros
    - ros2-rclcpp
    - ros2-rclcpp-lifecycle
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-ros2run
    - ros2-system-modes-msgs
  run:
    - python
    - ros2-builtin-interfaces
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-launch-ros
    - ros2-rclcpp
    - ros2-rclcpp-lifecycle
    - ros2-ros-workspace
    - ros2-system-modes-msgs
