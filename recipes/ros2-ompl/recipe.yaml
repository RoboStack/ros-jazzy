# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-ompl
  version: 2.0.1

build:
  number: 25
  script: ''
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://ompl.kavrakilab.org
  repository: https://github.com/ompl/ompl
  license: BSD-3-Clause
  summary: OMPL is a free sampling-based motion planning library.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - cmake
  host:
    - eigen
    - eigen-abi-devel
    - flann
    - libboost-devel
    - libboost-python-devel
    - ompl
    - pkg-config
    - python
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-ros-environment
    - ros2-ros-workspace
  run:
    - eigen
    - eigen-abi-devel
    - flann
    - libboost-devel
    - libboost-python-devel
    - ompl >=2.0.1, <2.1.0a0
    - python
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-ros-workspace
