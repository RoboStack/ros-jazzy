# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-swri-console
  version: 2.4.0
source:
  git: https://github.com/ros2-gbp/swri_console-release.git
  tag: release/jazzy/swri_console/2.4.0-1
  target_directory: ros2-swri-console/src/work
  patches:
    - patch/ros-jazzy-swri-console.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://ros.org/wiki/swri_console
  repository: https://github.com/swri-robotics/swri_console
  license: BSD-3-Clause
  summary: A rosout GUI viewer developed at Southwest Research Institute as an alternative to rqt_console.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
    - ${{ 'qt-main' if (build_platform != target_platform) }}
    - if: build_platform != target_platform
      then:
        - qt-main
  host:
    - ${{ 'libgl-devel' if linux }}
    - ${{ 'libopengl-devel' if linux }}
    - if: build_platform == target_platform
      then:
        - pkg-config
    - libboost-devel
    - numpy
    - pip
    - python
    - qt-main
    - ros2-ament-cmake
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-rcl-interfaces
    - ros2-rclcpp
    - ros2-rcutils
    - ros2-rmw
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-rosbag2-storage
    - ros2-rosbag2-transport
  run:
    - libboost
    - python
    - qt-main
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-rcl-interfaces
    - ros2-rclcpp
    - ros2-rcutils
    - ros2-rmw
    - ros2-ros-workspace
    - ros2-rosbag2-storage
    - ros2-rosbag2-storage-mcap
    - ros2-rosbag2-transport
