# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-camera-ros
  version: 0.7.0
source:
  git: https://github.com/ros2-gbp/camera_ros-release.git
  tag: release/jazzy/camera_ros/0.7.0-1
  target_directory: ros2-camera-ros/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/christianrauch/camera_ros
  license: MIT
  summary: node for libcamera supported cameras (V4L2, Raspberry Pi Camera Modules)
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - clang-format
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-clang-format
    - ros2-ament-cmake-cppcheck
    - ros2-ament-cmake-flake8
    - ros2-ament-cmake-lint-cmake
    - ros2-ament-cmake-mypy
    - ros2-ament-cmake-pep257
    - ros2-ament-cmake-pyflakes
    - ros2-ament-cmake-xmllint
    - ros2-ament-lint-auto
    - ros2-camera-info-manager
    - ros2-cv-bridge
    - ros2-diagnostic-msgs
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-libcamera
    - ros2-rclcpp
    - ros2-rclcpp-components
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-sensor-msgs
  run:
    - python
    - ros2-ament-index-python
    - ros2-camera-info-manager
    - ros2-cv-bridge
    - ros2-diagnostic-msgs
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-image-view
    - ros2-libcamera
    - ros2-rclcpp
    - ros2-rclcpp-components
    - ros2-ros-workspace
    - ros2-ros2launch
    - ros2-sensor-msgs
