# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-turtlebot4-gz-bringup
  version: 2.0.2
source:
  git: https://github.com/ros2-gbp/turtlebot4_simulator-release.git
  tag: release/jazzy/turtlebot4_gz_bringup/2.0.2-1
  target_directory: ros2-turtlebot4-gz-bringup/src/work
  patches:
    - patch/ros-jazzy-turtlebot4-gz-bringup.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/turtlebot/turtlebot4_simulator
  license: Apache-2.0
  summary: TurtleBot 4 Gazebo Simulator bringup
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-lint-auto
    - ros2-ament-lint-common
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-irobot-create-common-bringup
    - ros2-irobot-create-description
    - ros2-irobot-create-gz-bringup
    - ros2-irobot-create-gz-plugins
    - ros2-irobot-create-gz-toolbox
    - ros2-irobot-create-msgs
    - ros2-irobot-create-nodes
    - ros2-irobot-create-toolbox
    - ros2-ros-environment
    - ros2-ros-gz-interfaces
    - ros2-ros-gz-sim
    - ros2-ros-workspace
    - ros2-std-msgs
    - ros2-turtlebot4-description
    - ros2-turtlebot4-gz-gui-plugins
    - ros2-turtlebot4-gz-toolbox
    - ros2-turtlebot4-msgs
    - ros2-turtlebot4-navigation
    - ros2-turtlebot4-node
    - ros2-turtlebot4-viz
  run:
    - python
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-irobot-create-common-bringup
    - ros2-irobot-create-description
    - ros2-irobot-create-gz-bringup
    - ros2-irobot-create-gz-plugins
    - ros2-irobot-create-gz-toolbox
    - ros2-irobot-create-msgs
    - ros2-irobot-create-nodes
    - ros2-irobot-create-toolbox
    - ros2-ros-gz-interfaces
    - ros2-ros-gz-sim
    - ros2-ros-workspace
    - ros2-std-msgs
    - ros2-turtlebot4-description
    - ros2-turtlebot4-gz-gui-plugins
    - ros2-turtlebot4-gz-toolbox
    - ros2-turtlebot4-msgs
    - ros2-turtlebot4-navigation
    - ros2-turtlebot4-node
    - ros2-turtlebot4-viz
