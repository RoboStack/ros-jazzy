# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-desktop
  version: 0.11.0
source:
  git: https://github.com/ros2-gbp/variants-release.git
  tag: release/jazzy/desktop/0.11.0-1
  target_directory: ros2-desktop/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/ros2/variants
  license: Apache-2.0
  summary: A package which extends 'ros_base' and includes high level packages like vizualization tools and demos.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-ros-environment
    - ros2-ros-workspace
  run:
    - python
    - ros2-action-tutorials-cpp
    - ros2-action-tutorials-interfaces
    - ros2-action-tutorials-py
    - ros2-angles
    - ros2-composition
    - ros2-demo-nodes-cpp
    - ros2-demo-nodes-cpp-native
    - ros2-demo-nodes-py
    - ros2-depthimage-to-laserscan
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-dummy-map-server
    - ros2-dummy-robot-bringup
    - ros2-dummy-sensors
    - ros2-examples-rclcpp-minimal-action-client
    - ros2-examples-rclcpp-minimal-action-server
    - ros2-examples-rclcpp-minimal-client
    - ros2-examples-rclcpp-minimal-composition
    - ros2-examples-rclcpp-minimal-publisher
    - ros2-examples-rclcpp-minimal-service
    - ros2-examples-rclcpp-minimal-subscriber
    - ros2-examples-rclcpp-minimal-timer
    - ros2-examples-rclcpp-multithreaded-executor
    - ros2-examples-rclpy-executors
    - ros2-examples-rclpy-minimal-action-client
    - ros2-examples-rclpy-minimal-action-server
    - ros2-examples-rclpy-minimal-client
    - ros2-examples-rclpy-minimal-publisher
    - ros2-examples-rclpy-minimal-service
    - ros2-examples-rclpy-minimal-subscriber
    - ros2-image-tools
    - ros2-intra-process-demo
    - ros2-joy
    - ros2-lifecycle
    - ros2-logging-demo
    - ros2-pcl-conversions
    - ros2-pendulum-msgs
    - ros2-quality-of-service-demo-cpp
    - ros2-quality-of-service-demo-py
    - ros2-ros-base
    - ros2-ros-workspace
    - ros2-rqt-common-plugins
    - ros2-rviz-default-plugins
    - ros2-rviz2
    - ros2-teleop-twist-joy
    - ros2-teleop-twist-keyboard
    - ros2-topic-monitor
    - ros2-turtlesim
tests:
  - script:
      - ros2 pkg prefix desktop
    requirements:
      run:
        - ros-jazzy-ros2pkg
