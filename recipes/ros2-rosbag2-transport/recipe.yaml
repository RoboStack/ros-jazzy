# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-rosbag2-transport
  version: 0.26.11
source:
  git: https://github.com/ros2-gbp/rosbag2-release.git
  tag: release/jazzy/rosbag2_transport/0.26.11-1
  target_directory: ros2-rosbag2-transport/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/ros2/rosbag2
  license: Apache-2.0
  summary: Layer encapsulating ROS middleware to allow rosbag2 to be used with or without middleware
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros2-ament-cmake-gmock
    - ros2-ament-cmake-ros
    - ros2-ament-index-cpp
    - ros2-ament-lint-auto
    - ros2-ament-lint-common
    - ros2-composition-interfaces
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-keyboard-handler
    - ros2-rclcpp
    - ros2-rclcpp-components
    - ros2-rcpputils
    - ros2-rcutils
    - ros2-rmw
    - ros2-rmw-implementation-cmake
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-rosbag2-compression
    - ros2-rosbag2-compression-zstd
    - ros2-rosbag2-cpp
    - ros2-rosbag2-interfaces
    - ros2-rosbag2-storage
    - ros2-rosbag2-storage-default-plugins
    - ros2-rosbag2-test-common
    - ros2-test-msgs
    - ros2-yaml-cpp-vendor
  run:
    - python
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-keyboard-handler
    - ros2-rclcpp
    - ros2-rclcpp-components
    - ros2-rcpputils
    - ros2-rcutils
    - ros2-rmw
    - ros2-ros-workspace
    - ros2-rosbag2-compression
    - ros2-rosbag2-cpp
    - ros2-rosbag2-interfaces
    - ros2-rosbag2-storage
    - ros2-yaml-cpp-vendor
