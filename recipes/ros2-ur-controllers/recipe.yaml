# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-ur-controllers
  version: 3.9.0
source:
  git: https://github.com/ros2-gbp/Universal_Robots_ROS2_Driver-release.git
  tag: release/jazzy/ur_controllers/3.9.0-1
  target_directory: ros2-ur-controllers/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://docs.universal-robots.com/Universal_Robots_ROS_Documentation/
  repository: https://github.com/UniversalRobots/Universal_Robots_ROS2_Driver
  license: BSD-3-Clause
  summary: Provides controllers that use the speed scaling interface of Universal Robots.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros2-action-msgs
    - ros2-ament-cmake
    - ros2-angles
    - ros2-control-msgs
    - ros2-controller-interface
    - ros2-controller-manager
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-generate-parameter-library
    - ros2-geometry-msgs
    - ros2-hardware-interface
    - ros2-hardware-interface-testing
    - ros2-joint-trajectory-controller
    - ros2-lifecycle-msgs
    - ros2-pluginlib
    - ros2-rclcpp-lifecycle
    - ros2-rcutils
    - ros2-realtime-tools
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-ros2-control-test-assets
    - ros2-std-msgs
    - ros2-std-srvs
    - ros2-tf2-geometry-msgs
    - ros2-tf2-ros
    - ros2-trajectory-msgs
    - ros2-ur-dashboard-msgs
    - ros2-ur-msgs
  run:
    - python
    - ros2-action-msgs
    - ros2-angles
    - ros2-control-msgs
    - ros2-controller-interface
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-generate-parameter-library
    - ros2-geometry-msgs
    - ros2-hardware-interface
    - ros2-joint-trajectory-controller
    - ros2-lifecycle-msgs
    - ros2-pluginlib
    - ros2-rclcpp-lifecycle
    - ros2-rcutils
    - ros2-realtime-tools
    - ros2-ros-workspace
    - ros2-std-msgs
    - ros2-std-srvs
    - ros2-tf2-geometry-msgs
    - ros2-tf2-ros
    - ros2-trajectory-msgs
    - ros2-ur-dashboard-msgs
    - ros2-ur-msgs
