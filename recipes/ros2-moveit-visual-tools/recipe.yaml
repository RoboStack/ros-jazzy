# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-moveit-visual-tools
  version: 4.2.0
source:
  git: https://github.com/ros2-gbp/moveit_visual_tools-release.git
  tag: release/jazzy/moveit_visual_tools/4.2.0-1
  target_directory: ros2-moveit-visual-tools/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://github.com/ros-planning/moveit_visual_tools
  repository: https://github.com/ros-planning/moveit_visual_tools
  license: BSD-3-Clause
  summary: Helper functions for displaying and debugging MoveIt data in Rviz via published markers
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - ${{ 'libgl-devel' if linux }}
    - ${{ 'libopengl-devel' if linux }}
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-index-cpp
    - ros2-ament-lint-auto
    - ros2-ament-lint-common
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometric-shapes
    - ros2-geometry-msgs
    - ros2-graph-msgs
    - ros2-interactive-markers
    - ros2-moveit-common
    - ros2-moveit-core
    - ros2-moveit-msgs
    - ros2-moveit-ros-planning
    - ros2-rclcpp
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-rviz-visual-tools
    - ros2-std-msgs
    - ros2-tf2-eigen
    - ros2-tf2-ros
    - ros2-trajectory-msgs
    - ros2-visualization-msgs
  run:
    - python
    - ros2-ament-index-cpp
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometric-shapes
    - ros2-geometry-msgs
    - ros2-graph-msgs
    - ros2-interactive-markers
    - ros2-moveit-common
    - ros2-moveit-core
    - ros2-moveit-msgs
    - ros2-moveit-ros-planning
    - ros2-rclcpp
    - ros2-ros-workspace
    - ros2-rviz-visual-tools
    - ros2-std-msgs
    - ros2-tf2-eigen
    - ros2-tf2-ros
    - ros2-trajectory-msgs
    - ros2-visualization-msgs
