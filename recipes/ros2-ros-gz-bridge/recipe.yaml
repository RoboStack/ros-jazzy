# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-ros-gz-bridge
  version: 1.0.24
source:
  git: https://github.com/ros2-gbp/ros_ign-release.git
  tag: release/jazzy/ros_gz_bridge/1.0.24-1
  target_directory: ros2-ros-gz-bridge/src/work
  patches:
    - patch/ros-jazzy-ros-gz-bridge.win.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/gazebosim/ros_gz
  license: Apache-2.0
  summary: Bridge communication between ROS and Gazebo Transport
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - pkg-config
    - python
    - ros2-actuator-msgs
    - ros2-ament-cmake
    - ros2-ament-cmake-gtest
    - ros2-ament-cmake-python
    - ros2-ament-lint-auto
    - ros2-ament-lint-common
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-gps-msgs
    - ros2-gz-msgs-vendor
    - ros2-gz-transport-vendor
    - ros2-launch
    - ros2-launch-ros
    - ros2-launch-testing
    - ros2-launch-testing-ament-cmake
    - ros2-marine-acoustic-msgs
    - ros2-nav-msgs
    - ros2-rclcpp
    - ros2-rclcpp-components
    - ros2-ros-environment
    - ros2-ros-gz-interfaces
    - ros2-ros-workspace
    - ros2-rosgraph-msgs
    - ros2-rosidl-pycommon
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-tf2-msgs
    - ros2-trajectory-msgs
    - ros2-vision-msgs
    - ros2-yaml-cpp-vendor
  run:
    - python
    - ros2-actuator-msgs
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-gps-msgs
    - ros2-gz-msgs-vendor
    - ros2-gz-transport-vendor
    - ros2-launch
    - ros2-launch-ros
    - ros2-marine-acoustic-msgs
    - ros2-nav-msgs
    - ros2-rclcpp
    - ros2-rclcpp-components
    - ros2-ros-gz-interfaces
    - ros2-ros-workspace
    - ros2-rosgraph-msgs
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-tf2-msgs
    - ros2-trajectory-msgs
    - ros2-vision-msgs
    - ros2-yaml-cpp-vendor
