# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-rviz-rendering
  version: 14.1.24
source:
  git: https://github.com/ros2-gbp/rviz-release.git
  tag: release/jazzy/rviz_rendering/14.1.24-1
  target_directory: ros2-rviz-rendering/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://github.com/ros2/rviz/blob/ros2/README.md
  repository: https://github.com/ros2/rviz
  license: BSD-3-Clause
  summary: Library which provides the 3D rendering functionality in rviz.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
    - if: build_platform != target_platform
      then:
        - qt-main
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - eigen
    - eigen-abi-devel
    - glew
    - numpy
    - pip
    - python
    - qt-main
    - ros2-ament-cmake-cppcheck
    - ros2-ament-cmake-cpplint
    - ros2-ament-cmake-gmock
    - ros2-ament-cmake-gtest
    - ros2-ament-cmake-lint-cmake
    - ros2-ament-cmake-ros
    - ros2-ament-cmake-uncrustify
    - ros2-ament-cmake-xmllint
    - ros2-ament-index-cpp
    - ros2-ament-lint-auto
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-eigen3-cmake-module
    - ros2-resource-retriever
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-rviz-assimp-vendor
    - ros2-rviz-ogre-vendor
  run:
    - eigen
    - eigen-abi-devel
    - python
    - qt-main
    - ros2-ament-index-cpp
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-eigen3-cmake-module
    - ros2-resource-retriever
    - ros2-ros-workspace
    - ros2-rviz-assimp-vendor
    - ros2-rviz-ogre-vendor
