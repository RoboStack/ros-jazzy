# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-nav2-amcl
  version: 1.3.13
source:
  git: https://github.com/SteveMacenski/navigation2-release.git
  tag: release/jazzy/nav2_amcl/1.3.13-1
  target_directory: ros2-nav2-amcl/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/ros-planning/navigation2
  license: LGPL-2.1-or-later
  summary: <p>amcl is a probabilistic localization system for a robot moving in 2D. It implements the adaptive (or KLD-sampling) Monte Carlo localization approach (as described by Dieter Fox), which uses a particle filter to track the pose of a robot against a known map.</p><p>This node is derived, with thanks, from Andrew Howard's excellent 'amcl' Player driver.</p>
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-lint-auto
    - ros2-ament-lint-common
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-launch-ros
    - ros2-launch-testing
    - ros2-message-filters
    - ros2-nav-msgs
    - ros2-nav2-common
    - ros2-nav2-msgs
    - ros2-nav2-util
    - ros2-pluginlib
    - ros2-rclcpp
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-sensor-msgs
    - ros2-std-srvs
    - ros2-tf2
    - ros2-tf2-geometry-msgs
    - ros2-tf2-ros
  run:
    - python
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-launch-ros
    - ros2-launch-testing
    - ros2-message-filters
    - ros2-nav-msgs
    - ros2-nav2-msgs
    - ros2-nav2-util
    - ros2-pluginlib
    - ros2-rclcpp
    - ros2-ros-workspace
    - ros2-sensor-msgs
    - ros2-std-srvs
    - ros2-tf2
    - ros2-tf2-geometry-msgs
    - ros2-tf2-ros
