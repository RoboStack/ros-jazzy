# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-hardware-interface-testing
  version: 4.49.0
source:
  git: https://github.com/ros2-gbp/ros2_control-release.git
  tag: release/jazzy/hardware_interface_testing/4.49.0-1
  target_directory: ros2-hardware-interface-testing/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/ros-controls/ros2_control
  license: Apache-2.0
  summary: Commonly used test fixtures for the ros2_control framework
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - fmt
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-gmock
    - ros2-control-msgs
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-hardware-interface
    - ros2-lifecycle-msgs
    - ros2-pluginlib
    - ros2-rclcpp-lifecycle
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-ros2-control-cmake
    - ros2-ros2-control-test-assets
  run:
    - fmt
    - python
    - ros2-control-msgs
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-hardware-interface
    - ros2-lifecycle-msgs
    - ros2-pluginlib
    - ros2-rclcpp-lifecycle
    - ros2-ros-workspace
    - ros2-ros2-control-test-assets
