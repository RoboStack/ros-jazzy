# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-rviz-ogre-vendor
  version: 14.1.24
source:
  git: https://github.com/ros2-gbp/rviz-release.git
  tag: release/jazzy/rviz_ogre_vendor/14.1.24-1
  target_directory: ros2-rviz-ogre-vendor/src/work
  patches:
    - patch/ros-jazzy-rviz-ogre-vendor.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://www.ogre3d.org/
  repository: https://github.com/ros2/rviz
  license: Apache-2.0 OR MIT
  summary: Wrapper around ogre3d, it provides a fixed CMake module and an ExternalProject build of ogre.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
    - vcstool
    - setuptools <81
  host:
    - ${{ 'libglu' if linux }}
    - assimp
    - if: build_platform == target_platform
      then:
        - pkg-config
    - freeimage
    - freetype
    - glew
    - numpy
    - pip
    - pugixml
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-vendor-package
    - ros2-ament-cmake-xmllint
    - ros2-ament-lint-auto
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-ros-environment
    - ros2-ros-workspace
    - setuptools <81
    - xorg-libx11
    - xorg-libxaw
    - xorg-libxrandr
    - xorg-xorgproto
    - zlib
    - zziplib
  run:
    - assimp
    - freetype
    - glew
    - python
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-ros-workspace
    - xorg-libx11
    - xorg-libxaw
    - xorg-libxrandr
    - xorg-xorgproto
