# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-nobleo-socketcan-bridge
  version: 1.0.4
source:
  git: https://github.com/ros2-gbp/nobleo_socketcan_bridge-release.git
  tag: release/jazzy/nobleo_socketcan_bridge/1.0.4-1
  target_directory: ros2-nobleo-socketcan-bridge/src/work
  patches:
    - patch/ros-jazzy-nobleo-socketcan-bridge.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://github.com/nobleo/nobleo_socketcan_bridge
  repository: https://github.com/nobleo/nobleo_socketcan_bridge
  license: Apache-2.0
  summary: Simple wrapper around SocketCAN
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - fmt
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-clang-format
    - ros2-ament-cmake-cppcheck
    - ros2-ament-cmake-cpplint
    - ros2-ament-cmake-lint-cmake
    - ros2-ament-cmake-ros
    - ros2-ament-cmake-xmllint
    - ros2-ament-lint-auto
    - ros2-can-msgs
    - ros2-diagnostic-msgs
    - ros2-diagnostic-updater
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-rclcpp
    - ros2-rclcpp-components
    - ros2-ros-environment
    - ros2-ros-workspace
  run:
    - fmt
    - python
    - ros2-can-msgs
    - ros2-diagnostic-msgs
    - ros2-diagnostic-updater
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-rclcpp
    - ros2-rclcpp-components
    - ros2-ros-workspace
