# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-vision-msgs-rviz-plugins
  version: 4.1.1
source:
  git: https://github.com/ros2-gbp/vision_msgs-release.git
  tag: release/jazzy/vision_msgs_rviz_plugins/4.1.1-3
  target_directory: ros2-vision-msgs-rviz-plugins/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/ros-perception/vision_msgs
  license: Apache-2.0
  summary: RVIZ2 plugins for visualizing vision_msgs
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
    - ${{ 'qt-main' if (build_platform != target_platform) }}
  host:
    - ${{ 'libgl-devel' if linux }}
    - ${{ 'libopengl-devel' if linux }}
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-python
    - ros2-ament-lint-auto
    - ros2-ament-lint-common
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-pluginlib
    - ros2-rclcpp
    - ros2-rclpy
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-rviz-common
    - ros2-rviz-default-plugins
    - ros2-rviz-rendering
    - ros2-rviz2
    - ros2-vision-msgs
    - ros2-yaml-cpp-vendor
  run:
    - numpy
    - python
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-pluginlib
    - ros2-rclcpp
    - ros2-rclpy
    - ros2-ros-workspace
    - ros2-rviz-common
    - ros2-rviz-default-plugins
    - ros2-rviz-rendering
    - ros2-rviz2
    - ros2-vision-msgs
    - ros2-yaml-cpp-vendor
