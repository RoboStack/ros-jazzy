# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-proxsuite
  version: 0.7.3

build:
  number: 21
  script: ''
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://simple-robotics.github.io/proxsuite
  repository: https://github.com/Simple-Robotics/proxsuite
  license: BSD-2-Clause
  summary: The Advanced Proximal Optimization Toolbox
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - git
    - if: build_platform != target_platform
      then:
        - doxygen
  host:
    - eigen
    - eigen-abi-devel
    - graphviz
    - numpy
    - python
    - ros2-distro-mutex 0.16.* jazzy_*
    - ros2-ros-environment
    - ros2-ros-workspace
    - scipy
    - if: build_platform == target_platform
      then:
        - git
    - if: build_platform == target_platform
      then:
        - doxygen
  run:
    - eigen
    - eigen-abi-devel
    - numpy
    - proxsuite >=0.7.3, <0.8.0a0
    - python
    - ros2-distro-mutex 0.16.* jazzy_*
    - ros2-ros-workspace
    - scipy
