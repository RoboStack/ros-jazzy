# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-sbg-driver
  version: 3.4.0
source:
  git: https://github.com/SBG-Systems/sbg_ros2-release.git
  tag: release/jazzy/sbg_driver/3.4.0-1
  target_directory: ros2-sbg-driver/src/work
  patches:
    - patch/ros-jazzy-sbg-driver.patch
    - patch/ros-jazzy-sbg-driver.win.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://wiki.ros.org/sbg_driver
  repository: https://github.com/SBG-Systems/sbg_ros2
  license: MIT
  summary: ROS driver package for communication with the SBG navigation systems.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
    - if: target_platform == 'emscripten-wasm32'
      then:
        - ros2-rosidl-default-generators
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-nav-msgs
    - ros2-nmea-msgs
    - ros2-rclcpp
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-rosidl-default-generators
    - ros2-rtcm-msgs
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-std-srvs
    - ros2-tf2-geometry-msgs
    - ros2-tf2-msgs
    - ros2-tf2-ros
    - ros2-urdf
  run:
    - python
    - ros2-distro-mutex 0.19.* jazzy_*
    - ros2-geometry-msgs
    - ros2-nav-msgs
    - ros2-nmea-msgs
    - ros2-rclcpp
    - ros2-ros-workspace
    - ros2-rosidl-default-runtime
    - ros2-rtcm-msgs
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-std-srvs
    - ros2-tf2-geometry-msgs
    - ros2-tf2-msgs
    - ros2-tf2-ros
    - ros2-urdf
    - ros2-xacro
